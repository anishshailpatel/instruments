<style>
:root {

}

    --good: #7d9d88; --bad: #b08d80; --warn: #c2a25a; --good-bg: rgba(125, 157, 136, 0.12); --bad-bg: rgba(176, 141, 128, 0.12); --warn-bg: rgba(194, 162, 90, 0.14);
  }
}
:root[data-theme="dark"] {
  --paper: #15171b; --panel: #1c1f25; --ink: #e6e7ea; --ink-soft: #a6abb4; --ink-faint: #979da6; --ink-mute: #8d939c; --rule: #2c3037; --rule-firm: #3a4150; --field: #1d2026;
  --accent: #e0745e; --accent-text: #e88a76; --accent-soft: rgba(224, 116, 94, 0.16); --thumb-ring: #15171b;
  --good: #7d9d88; --bad: #b08d80; --warn: #c2a25a; --good-bg: rgba(125, 157, 136, 0.12); --bad-bg: rgba(176, 141, 128, 0.12); --warn-bg: rgba(194, 162, 90, 0.14);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
.sheet { max-width: 42rem; margin: 0 auto; padding: 2.2rem 1.25rem 4rem; }
h1 { font-weight: 600; font-size: 1.9rem; line-height: 1.15; letter-spacing: -0.01em; margin: 0 0 0.6rem; text-wrap: balance; }
.standfirst { margin: 0; color: var(--ink-soft); font-size: 1rem; max-width: 36em; }
nav.contents { margin-top: 1.4rem; font-family: var(--sans); font-size: 0.9rem; }
nav.contents ol { margin: 0; padding-left: 1.4rem; columns: 2; column-gap: 2rem; }
nav.contents li { margin: 0.15rem 0; break-inside: avoid; }
nav.contents a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); }
nav.contents a:hover { color: var(--accent-text); border-color: var(--accent); }

@media (max-width: 480px) { nav.contents ol { columns: 1; } }
hr { border: 0; border-top: 1px solid var(--rule); margin: 2.6rem 0; }
section { display: flex; flex-direction: column; gap: 1rem; }
.eyebrow { margin: 0; font-family: var(--sans); font-size: 0.72rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mute); }
.eyebrow b { color: var(--ink-soft); font-weight: 600; }
h2 { margin: 0; font-weight: 600; font-size: 1.32rem; line-height: 1.25; text-wrap: balance; }
p { margin: 0; }
.claim { color: var(--ink); font-size: 1.05rem; }
.close { color: var(--ink-soft); font-size: 1rem; max-width: 36em; }

/* the three layers: the card, the tool, the working. No labels and no stamp; the dashed border and the duller colours are what say quoted */
.layer { display: flex; flex-direction: column; gap: 0.6rem; }

/* layer one: the pack, quoted rather than endorsed */
.card { display: grid; gap: 0.6rem 1rem; padding: 0.9rem 1rem; background: var(--panel); border: 1px dashed var(--rule-firm); border-radius: 6px; font-family: var(--sans); max-width: 430px; }
.card.c2 { grid-template-columns: 1fr 1fr; } .card.c3 { grid-template-columns: 1fr 1fr 1fr; } .card.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
@media (max-width: 480px) { .card.c4 { grid-template-columns: 1fr 1fr; } }
.card .k { display: block; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 0.15rem; }
.card .v { display: block; font-size: 1.35rem; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; color: var(--ink); }
.card .d { display: inline-block; margin-top: 0.25rem; font-size: 0.78rem; font-weight: 600; padding: 0.1rem 0.45rem; border-radius: 3px; font-variant-numeric: tabular-nums; }
.card .d.good { color: var(--good); background: var(--good-bg); } .card .d.bad { color: var(--bad); background: var(--bad-bg); } .card .d.flat { color: var(--ink-soft); background: var(--rule); }
.card .tag { display: inline-block; font-size: 0.78rem; font-weight: 600; padding: 0.15rem 0.5rem; border-radius: 3px; }
.card .tag.good { color: var(--good); background: var(--good-bg); } .card .tag.warn { color: var(--warn); background: var(--warn-bg); } .card .tag.bad { color: var(--bad); background: var(--bad-bg); }
.card .row { grid-column: 1 / -1; overflow-x: auto; }
.card table { border-collapse: collapse; font-size: 0.78rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card table th { font-weight: 500; color: var(--ink-mute); padding: 0 0.45rem 0.15rem 0; text-align: right; }
.card table td { padding: 0 0.45rem 0 0; text-align: right; color: var(--ink); }
.card table th:first-child, .card table td:first-child { text-align: left; }
.card .note { display: block; margin-top: 0.25rem; font-size: 0.78rem; color: var(--ink-soft); }

/* layer two: the instrument. The case strip carries the tool's own parameters, essay figures as defaults */
.case { display: flex; flex-wrap: wrap; gap: 0.45rem 0.9rem; align-items: flex-end; font-family: var(--sans); font-size: 0.8rem; color: var(--ink-soft); padding: 0.6rem 0.75rem 0.65rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); }
.case .case-label { flex-basis: 100%; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mute); }
.case .cf { display: flex; flex-direction: column; gap: 0.15rem; }
.case .cf > span:first-child { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-mute); line-height: 1.2; }
.case .in { display: flex; align-items: center; gap: 0.2rem; }
.case .in b { font-weight: 500; color: var(--ink-mute); }
.case input, .stage input { font: inherit; font-family: var(--sans); font-size: 0.9rem; font-weight: 600; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 4px; padding: 0.3rem 0.4rem; width: 5.6em; min-height: 36px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.case input::-webkit-inner-spin-button, .stage input::-webkit-inner-spin-button { -webkit-appearance: none; }
.case input:focus-visible, .stage input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.case .reset { margin-left: auto; align-self: flex-end; font: inherit; font-family: var(--sans); font-size: 0.75rem; font-weight: 500; color: var(--ink-soft); background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 0.35rem 0.7rem; min-height: 36px; cursor: pointer; }
.case .reset:hover { color: var(--accent-text); border-color: var(--accent); }
.case .derived { flex-basis: 100%; font-size: 0.78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.stage input { width: 100%; text-align: center; padding: 0.3rem 0.2rem; }
@media (max-width: 480px) { .case input, .stage input { font-size: 16px; } .stage input { text-align: right; } }
.tool { display: flex; flex-direction: column; gap: 0.9rem; max-width: 430px; }
.tool svg { width: 100%; height: auto; display: block; color: var(--ink); overflow: hidden; }
.tool svg text { font-family: var(--sans); }
button:focus-visible, nav.contents a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.controls { display: flex; flex-direction: column; gap: 0.4rem; }
.control { display: flex; flex-direction: column; gap: 0.3rem; font-family: var(--sans); font-size: 0.9rem; color: var(--ink-soft); }
.control label output, .control label b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.control .aside { color: var(--ink-mute); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer; touch-action: pan-y; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: var(--rule); border-radius: 2px; }
input[type="range"]::-moz-range-track { height: 3px; background: var(--rule); border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; margin-top: -11.5px; border-radius: 50%; background: var(--accent); border: 3px solid var(--thumb-ring); box-shadow: 0 0 0 1px var(--accent); }
input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 3px solid var(--thumb-ring); box-shadow: 0 0 0 1px var(--accent); }
input[type="range"]:focus-visible { outline: none; }
input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }
input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 0.35rem; font-family: var(--sans); font-size: 0.85rem; }
.seg label { border: 1px solid var(--rule); border-radius: 4px; padding: 0.5rem 0.75rem; cursor: pointer; color: var(--ink-soft); min-height: 44px; display: flex; align-items: center; background: var(--field); }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg input:checked + span { color: var(--ink); font-weight: 600; }
.seg label:has(input:checked) { border-color: var(--accent); color: var(--ink); box-shadow: inset 0 0 0 1px var(--accent); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
.readout { font-family: var(--serif); font-size: 1.05rem; line-height: 1.55; color: var(--ink); font-variant-numeric: tabular-nums; border-left: 2px solid var(--accent); padding-left: 0.85rem; }
.readout .n { font-weight: 600; }
.readout .sub { display: block; color: var(--ink-soft); font-size: 0.98rem; margin-top: 0.25rem; }
.btn { font: inherit; font-family: var(--sans); font-size: 0.85rem; font-weight: 500; color: var(--accent-text); background: none; border: 1px solid var(--accent); border-radius: 4px; padding: 0.55rem 0.8rem; min-height: 44px; cursor: pointer; }
.btn.quiet { color: var(--ink-soft); border-color: var(--rule); }
/* funnel stages */
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem; font-family: var(--sans); font-size: 0.8rem; }
.stage { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem 0.5rem; align-items: end; min-width: 0; }
.stage .nm { grid-column: 1 / -1; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; color: var(--ink); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage .fld { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
.stage .fld > span { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.02em; line-height: 1.25; color: var(--ink-mute); text-wrap: balance; }
.stage .fld .in { display: flex; align-items: center; gap: 0.2rem; }
.stage .fld b { font-size: 0.7rem; font-weight: 500; color: var(--ink-mute); white-space: nowrap; }
.stage-note { margin: 0; font-family: var(--sans); font-size: 0.8rem; line-height: 1.45; color: var(--ink-soft); }
.stage-note b { color: var(--ink); font-weight: 600; }
.stage input { font: inherit; font-family: var(--sans); font-size: 0.9rem; font-weight: 600; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 4px; padding: 0.3rem 0.4rem; width: 100%; min-width: 0; min-height: 36px; font-variant-numeric: tabular-nums; text-align: right; -moz-appearance: textfield; }
.stage input::-webkit-inner-spin-button { -webkit-appearance: none; }
.stage input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 480px) { .stages { grid-template-columns: 1fr; gap: 0.7rem; } .stage input { font-size: 16px; } }
.gate-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; font-family: var(--sans); font-size: 0.85rem; color: var(--ink-soft); }

.board { overflow-x: auto; font-family: var(--sans); font-size: 0.8rem; max-width: 430px; }
.board table { border-collapse: collapse; width: 100%; min-width: 330px; font-variant-numeric: tabular-nums; }
.board th, .board td { padding: 0.3rem 0.4rem; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
.board th:first-child, .board td:first-child { text-align: left; color: var(--ink-mute); font-weight: 500; padding-left: 0; }
.board thead th { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-mute); border-bottom: 1px solid var(--rule-firm); }
.board thead th.on { color: var(--accent-text); }
.board tr.worth td { font-weight: 600; font-size: 0.95rem; border-bottom: 0; padding-top: 0.45rem; }
.board td.on { color: var(--accent-text); }

/* layer three: the working */
details.working { border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); max-width: 430px; font-family: var(--sans); }
details.working summary { cursor: pointer; padding: 0.7rem 1rem; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); list-style: none; }
details.working summary::-webkit-details-marker { display: none; }
details.working summary::before { content: "+"; display: inline-block; width: 1.2em; color: var(--accent-text); font-weight: 600; }
details.working[open] summary::before { content: "−"; }
details.working .w { padding: 0 1rem 0.9rem; font-family: var(--mono); font-size: 0.8rem; line-height: 1.6; color: var(--ink-soft); }
details.working .w p { margin: 0 0 0.5rem; }
details.working .w p:last-child { margin: 0; }
details.working .w i, details.working .w .essay { font-family: var(--sans); font-style: normal; color: var(--ink-mute); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>html.hosted body { background: transparent; } html:not(.hosted) .sheet { padding: 0.9rem 0.85rem 1rem; } .sheet { padding: 0.2rem 0 0.4rem; max-width: none; } section { gap: 0.9rem; } .card, .board, .tool, details.working, .case, .stages, .stage-note { max-width: none; } .tool > div[id$="Svg"] { max-width: 560px; } .controls, .control, .seg, .readout { max-width: 620px; } @media (max-width: 560px) { .tool > div[id$="Svg"] { max-width: none; } }</style>

<div class="sheet">
<section id="cycle">
    <div class="layer"><div class="card c3" id="cycleCard"></div></div>
    <div class="layer">
      <div class="tool">
        <div class="case" id="cycleCase"></div>
        <div id="cycleSvg"></div>

        </div>

  </section>
</div>

<script>

  function makeRng(seed) { var a = seed >>> 0; return function () { a += 0x6D2B79F5; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function normal(rng) { var u1 = rng() || 1e-12, u2 = rng(); return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2); }
  var LF = [0, 0];
  function lnfact(n) { while (LF.length <= n) LF.push(LF[LF.length - 1] + Math.log(LF.length)); return LF[n]; }
  function binomPmf(n, k, p) { if (p <= 0) return k === 0 ? 1 : 0; if (p >= 1) return k === n ? 1 : 0; return Math.exp(lnfact(n) - lnfact(k) - lnfact(n - k) + k * Math.log(p) + (n - k) * Math.log(1 - p)); }
  function fmtNum(x, dp) { var s = x.toFixed(dp); var parts = s.split("."); parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); return parts.join("."); }
  function on(ids, fn) { ids.forEach(function (id) { $(id).addEventListener("input", fn); }); }
  function onRadios(name, fn) { document.querySelectorAll('input[name="' + name + '"]').forEach(function (el) { el.addEventListener("change", fn); }); }
  function radio(name) { var el = document.querySelector('input[name="' + name + '"]:checked'); return el ? el.value : ""; }
  function seg(id, name, items, checked) { $(id).innerHTML = items.map(function (it) { return '<label><input type="radio" name="' + name + '" value="' + it[0] + '"' + (String(it[0]) === String(checked) ? " checked" : "") + '><span>' + it[1] + '</span></label>'; }).join(""); }
  function tile(k, v, d, cls) { return '<div><span class="k">' + k + '</span><span class="v">' + v + '</span>' + (d ? '<span class="d ' + (cls || "flat") + '">' + d + '</span>' : '') + '</div>'; }
  function tag(t, cls) { return '<span class="tag ' + cls + '">' + t + '</span>'; }
  function stamp(k, t, cls, note) { return '<div><span class="k">' + k + '</span><span class="v">' + tag(t, cls) + '</span>' + (note ? '<span class="note">' + note + '</span>' : '') + '</div>'; }
  function working(id, lines, essay) { $(id).innerHTML = lines.map(function (l) { return "<p>" + l + "</p>"; }).join("") + (essay ? '<p class="essay">' + esc(essay) + "</p>" : ""); }
  function caseUI(id, defs, onChange) {
    var box = $(id), html = '<span class="case-label">The case</span>';
    defs.forEach(function (d) { html += '<label class="cf"><span>' + d.label + '</span><span class="in">' + (d.prefix ? '<b>' + d.prefix + '</b>' : '') + '<input type="number" inputmode="decimal" data-k="' + d.k + '" value="' + d.v + '" min="' + d.min + '" max="' + d.max + '" step="' + (d.step || "any") + '" aria-label="' + d.label + '">' + (d.suffix ? '<b>' + d.suffix + '</b>' : '') + '</span></label>'; });
    html += '<button type="button" class="reset">Reset</button><span class="derived" hidden></span>';
    box.innerHTML = html;
    var inputs = {}; box.querySelectorAll("input").forEach(function (el) { inputs[el.getAttribute("data-k")] = el; el.addEventListener("input", onChange); el.addEventListener("blur", function () { el.value = get(el.getAttribute("data-k")); onChange(); }); });
    box.querySelector(".reset").addEventListener("click", function () { defs.forEach(function (d) { inputs[d.k].value = d.v; }); onChange(); });
    function get(k) { var el = inputs[k], v = parseFloat(el.value); if (isNaN(v)) v = +el.defaultValue; return Math.min(+el.max, Math.max(+el.min, v)); }
    return { get: get, derived: function (s) { var el = box.querySelector(".derived"); el.hidden = !s; el.textContent = s || ""; } };
  }
  function hatch(id, color) { return '<defs><pattern id="' + id + '" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="' + color + '" stroke-width="1" opacity="0.5"/></pattern></defs>'; }

  /* ================= 12. The cycle ================= */
  (function () {
    var C = CASE.cycle, H = C.horizon;
    var CU = caseUI("cycleCase", [
      { k: "leads", label: "New leads a month", v: C.leads, min: 1, max: 100000, step: 1 },
      { k: "win", label: "Win rate at decision", v: C.win, min: 1, max: 100, step: 1, suffix: "%" },
      { k: "deal", label: "Average deal", v: C.deal, min: 1, max: 1000000, step: 1, prefix: "£", suffix: "k" },
      { k: "decay", label: "Live deals lost a month while waiting", v: C.decay, min: 0, max: 60, step: 1, suffix: "%" }
    ], function () { render(); });
    $("cyLen").value = C.len;
    function run(N) {
      var L = CU.get("leads"), w = CU.get("win") / 100, d = CU.get("decay") / 100, deal = CU.get("deal") * 1000;
      var surv = Math.pow(1 - d, N), perMonth = L * surv * w, wip = 0;
      for (var j = 0; j < N; j++) wip += L * Math.pow(1 - d, j);
      var cum = [0], c = 0; for (var m = 1; m <= H; m++) { if (m > N) c += perMonth * deal; cum.push(c); }
      return { surv: surv, perMonth: perMonth, wip: wip, cum: cum, total: c, deal: deal, w: w, d: d, L: L };
    }
    function render() {
      var N = +$("cyLen").value, A = run(N), P = run(1), W = run(6);
      $("cyLenOut").textContent = plural(N, "month");
      working("cycleW", [
        "each month a live deal has a " + pct1(A.d * 100) + " chance of dying while it waits: the champion moves on, the budget goes elsewhere, a rival gets there first; survival to decision = (1 − " + pct1(A.d * 100) + ")^" + N + " = " + pct1(A.surv * 100),
        "won a month = leads × survival × win rate = " + fmtNum(A.L, 0) + " × " + pct1(A.surv * 100) + " × " + pct1(A.w * 100) + " = " + f1(A.perMonth),
        "deals in flight = leads × (1 + (1 − d) + (1 − d)² …) over the " + plural(N, "month") + " = " + Math.round(A.wip) + " <i>(Little's law, with the leak)</i>",
        "the line adds won × " + gbpBig(A.deal) + " from month " + (N + 1) + ", when the first cohort reaches a decision; the one-month line is the fixed reference and the frame does not rescale"
      ], C.essay);
      $("cycleCard").innerHTML = tile("New leads a month", fmtNum(A.L, 0), "unchanged", "flat") + tile("Pipeline", Math.round(A.wip) + " deals", gbpBig(A.wip * A.deal) + " in flight", N > 1 ? "good" : "flat") + stamp("Sales review", N >= 3 ? "Strong pipeline" : "On track", "good", N >= 3 ? "coverage up, decisions slow" : "decisions coming through");
      var lo = 0, hi = Math.max(P.total, 1) * 1.06;
      var X0 = 14, X1 = 262, Y0 = 24, Y1 = 132;
      function X(m) { return X0 + (X1 - X0) * m / H; } function Y(v) { return Y1 - (Y1 - Y0) * (v - lo) / (hi - lo); }
      var s = '<svg viewBox="0 0 345 160" role="img" aria-label="Revenue won, cumulative over two years, for a one-month sales cycle and the cycle you have set">';
      s += txt(X0, 13, "revenue won, cumulative; each line is one cycle length", 10, { opacity: 0.6 });
      s += txt(X0, 150, "now", 9.5, { opacity: 0.6 }); s += txt(X1, 150, "two years", 9.5, { opacity: 0.6, anchor: "end" });
      s += '<line x1="' + X0 + '" y1="' + Y(0).toFixed(1) + '" x2="' + X1 + '" y2="' + Y(0).toFixed(1) + '" stroke="currentColor" stroke-width="0.8" opacity="0.45"/>';
      function line(R, color, width, op, dash) { return '<polyline points="' + R.cum.map(function (v, i) { return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" ") + '" fill="none" stroke="' + color + '" stroke-width="' + width + '" opacity="' + op + '"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>'; }
      var refs = [{ R: P, n: 1 }, { R: W, n: 6 }].filter(function (o) { return o.n !== N; });
      refs.forEach(function (o) { s += line(o.R, "currentColor", 1, 0.3, "3 3"); });
      s += line(A, ACCENT, 1.7, 1);
      s += '<circle cx="' + X(N + 1).toFixed(1) + '" cy="' + Y(A.cum[N + 1]).toFixed(1) + '" r="3" fill="' + ACCENT + '"/>';
      s += txt(X(N + 1), Y(A.cum[N + 1]) - 7, "first decisions", 9.5, { fill: ACCENT, anchor: "start" });
      var marks = refs.map(function (o) { return { y: Y(o.R.total), val: gbpBig(o.R.total), band: plural(o.n, "month"), accent: false }; });
      marks.push({ y: Y(A.total), val: gbpBig(A.total), band: plural(N, "month"), accent: true });
      var used = [];
      marks.slice().sort(function (a, b) { return (b.accent ? 1 : 0) - (a.accent ? 1 : 0); }).forEach(function (mk) {
        var cands = [mk.y, mk.y - 30, mk.y + 30, mk.y - 60, mk.y + 60];
        for (var ci = 0; ci < cands.length; ci++) {
          var yy = Math.min(Y1 - 18, Math.max(Y0 + 8, cands[ci]));
          if (used.some(function (u) { return Math.abs(u - yy) < 30; })) continue;
          used.push(yy);
          s += txt(X1 + 5, yy, mk.val, 10, mk.accent ? { fill: ACCENT, weight: 600 } : { opacity: 0.7 });
          s += txt(X1 + 5, yy + 15, mk.band, 9.5, mk.accent ? { fill: ACCENT, opacity: 0.9 } : { opacity: 0.6 });
          return;
        }
      });
      s += "</svg>"; $("cycleSvg").innerHTML = s;
      var lost = 1 - A.surv, r, sub;
      if (N === 1) {
        r = "A one-month cycle loses <span class=\"n\">" + pct1(lost * 100) + "</span> of deals to waiting and wins " + f1(A.perMonth) + " a month, <span class=\"n\">" + gbpBig(A.total) + "</span> over two years.";
        sub = "Stretch the cycle and watch the pipeline swell while the line flattens. The leads, the win rate and the sellers are all the same.";
      } else {
        r = "A " + word(N) + "-month cycle loses <span class=\"n\">" + pct1(lost * 100) + "</span> of deals to waiting, so you win " + f1(A.perMonth) + " a month against " + f1(P.perMonth) + " on a one-month cycle. Over two years that is <span class=\"n\">" + gbpBig(A.total) + "</span> against " + gbpBig(P.total) + ".";
        sub = "Meanwhile the pipeline holds " + Math.round(A.wip) + " deals instead of " + Math.round(P.wip) + ", so the sales review sees a fuller funnel from a slower process, with the same sellers and the same win rate.";
      }
      $("cycleRead").innerHTML = r + "<span class=\"sub\">" + sub + "</span>";
    }
    on(["cyLen"], render); render();
  })();

  /* tell the page that embeds this how tall to make the frame */
  (function () {
    var last = 0;
    function report() {
      var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (h && Math.abs(h - last) > 2) { last = h; try { parent.postMessage({ instrument: "the-cycle", height: h }, "*"); } catch (e) {} }
    }
    window.addEventListener("load", report);
    window.addEventListener("resize", report);
    if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
    setTimeout(report, 120); setTimeout(report, 600);
  })();
})();
</script>
