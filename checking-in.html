  /* ---------- helpers ---------- */
  var ACCENT = "var(--accent)";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function txt(x, y, s, size, o) {
    o = o || {}; size = Math.max(size, 10.5); if (o.opacity && o.opacity < 0.6) o.opacity = 0.6;
    return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" font-size="' + size + '"' + (o.weight ? ' font-weight="' + o.weight + '"' : '') +
      ' fill="' + (o.fill || 'currentColor') + '"' + (o.opacity ? ' opacity="' + o.opacity + '"' : '') + (o.anchor ? ' text-anchor="' + o.anchor + '"' : '') + '>' + esc(s) + '</text>';
  }
  function setRange(id, range, value) { var el = $(id); el.min = range[0]; el.max = range[1]; el.step = range[2]; el.value = value; }
  function roundHalfEven(x) { x = Math.round(x * 1e6) / 1e6; var t = Math.trunc(x), f = Math.abs(x - t); if (Math.abs(f - 0.5) < 1e-9) return (t % 2 === 0) ? t : t + (x < 0 ? -1 : 1); return Math.round(x); }
  function poundsM1(v) { var a = Math.abs(v); if (a >= 1000) return "£" + (Math.round(a / 100) / 10).toFixed(1) + "bn"; if (a >= 100) return "£" + Math.round(a) + "m"; return "£" + f1(a) + "m"; }
  function poundsM(v) { var a = Math.abs(v); if (a >= 1000) return "£" + (Math.round(a / 100) / 10).toFixed(1) + "bn"; return "£" + roundHalfEven(a) + "m"; }
  function poundsK(v) { var sign = v < 0 ? "−" : "+"; var a = Math.abs(v); if (a >= 1000) return sign + "£" + (Math.round(a / 100) / 10).toFixed(1) + "m"; return sign + "£" + Math.round(a / 10) * 10 + "k"; }
  function pct1(x) { var v = Math.round(x * 10) / 10; return (v === Math.round(v) ? String(Math.round(v)) : v.toFixed(1)) + "%"; }
  function gbp(v) { var sign = v < 0 ? "−" : ""; var a = Math.abs(v); if (a >= 1e6) return sign + "£" + (Math.round(a / 1e5) / 10).toFixed(1) + "m"; return sign + "£" + Math.round(a).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function gbpBig(v) { var sign = v < 0 ? "−" : ""; var a = Math.abs(v); if (a >= 1e8) return sign + "£" + Math.round(a / 1e6) + "m"; if (a >= 1e6) return sign + "£" + f1(a / 1e6) + "m"; if (a >= 1e3) return sign + "£" + Math.round(a / 1e3) + "k"; return sign + "£" + Math.round(a); }
  function f1(x) { var v = Math.round(x * 10) / 10; return v === Math.round(v) ? String(Math.round(v)) : v.toFixed(1); }
  var WORDS = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"];
  function word(n) { return n >= 0 && n <= 12 && n === Math.round(n) ? WORDS[n] || "no" : String(n); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function plural(n, one, many) { many = many || one + "s"; var w = word(n); return (n === 0 ? "no" : w) + " " + (n === 1 ? one : many); }
  function months(x) { if (x > 40 * 12) return "over 40 years"; if (x >= 24) { var yv = Math.round(x / 6) / 2; return (yv === Math.round(yv) ? String(Math.round(yv)) : yv.toFixed(1)) + " years"; } if (x < 0.25) return "under a week"; if (x < 0.75) return "about a fortnight"; if (x < 1) return "under a month"; if (x >= 9.95) return Math.round(x) + " months"; var r = Math.round(x * 10) / 10; var s = Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)) : r.toFixed(1); return s + (s === "1" ? " month" : " months"); }
  function chance(p) { if (p >= 0.5) return "more often than not"; if (p < 0.005) return "less than one time in 200"; var d = 1 / p; d = d > 20 ? Math.round(d / 10) * 10 : Math.round(d); return "about one time in " + (d <= 12 ? WORDS[d] : d); }
  function makeRng(seed) { var a = seed >>> 0; return function () { a += 0x6D2B79F5; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function normal(rng) { var u1 = rng() || 1e-12, u2 = rng(); return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2); }
  var LF = [0, 0];
  function lnfact(n) { while (LF.length <= n) LF.push(LF[LF.length - 1] + Math.log(LF.length)); return LF[n]; }
  function binomPmf(n, k, p) { if (p <= 0) return k === 0 ? 1 : 0; if (p >= 1) return k === n ? 1 : 0; return Math.exp(lnfact(n) - lnfact(k) - lnfact(n - k) + k * Math.log(p) + (n - k) * Math.log(1 - p)); }
  function fmtNum(x, dp) { var s = x.toFixed(dp); var parts = s.split("."); parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); return parts.join("."); }
  function on(ids, fn) { ids.forEach(function (id) { $(id).addEventListener("input", fn); }); }
  function onRadios(name, fn) { document.querySelectorAll('input[name="' + name + '"]').forEach(function (el) { el.addEventListener("change", fn); }); }
  function radio(name) { var el = document.querySelector('input[name="' + name + '"]:checked'); return el ? el.value : ""; }
  function seg(id, name, items, checked) { $(id).innerHTML = items.map(function (it) { return '<label><input type="radio" name="' + name + '" value="' + it[0] + '"' + (String(it[0]) === String(checked) ? " checked" : "") + '><span>' + it[1] + '</span></label>'; }).join(""); }
  function tile(k, v, d, cls) { return '<div><span class="k">' + k + '</span><span class="v">' + v + '</span>' + (d ? '<span class="d ' + (cls || "flat") + '">' + d + '</span>' : '') + '</div>'; }
  function tag(t, cls) { return '<span class="tag ' + cls + '">' + t + '</span>'; }
  function stamp(k, t, cls, note) { return '<div><span class="k">' + k + '</span><span class="v">' + tag(t, cls) + '</span>' + (note ? '<span class="note">' + note + '</span>' : '') + '</div>'; }
  function working(id, lines) { $(id).innerHTML = lines.map(function (l) { return "<p>" + l + "</p>"; }).join(""); }
  /* the spine. Terms in order: a string is an operator, a pair is [name, live value],
     a third member is a class, and "out" marks the answer the equation arrives at.
     Labels and numbers only: the argument belongs in the Note, not in the tool. */
  function spine(id, label, terms) {
    var h = '<p class="lbl">' + label + '</p><div class="row">';
    terms.forEach(function (t) {
      if (typeof t === "string") { h += '<span class="op">' + t + '</span>'; return; }
      h += '<span class="term' + (t[2] ? " " + t[2] : "") + '"><span class="t">' + t[0] + '</span><span class="v">' + t[1] + '</span></span>';
    });
    $(id).innerHTML = h + '</div>';
  }
  function ticker(id, items) {
    $(id).innerHTML = items.map(function (it) {
      return '<div><span class="k">' + it[0] + '</span><span class="v' + (it[2] ? " " + it[2] : "") + '">' + it[1] + '</span></div>';
    }).join("");
  }
  function caseUI(id, defs, onChange) {
    var box = $(id), html = '<span class="case-label">The case</span>';
    defs.forEach(function (d) { html += '<label class="cf"><span>' + d.label + '</span><span class="in">' + (d.prefix ? '<b>' + d.prefix + '</b>' : '') + '<input type="number" inputmode="decimal" data-k="' + d.k + '" value="' + d.v + '" min="' + d.min + '" max="' + d.max + '" step="' + (d.step || "any") + '" aria-label="' + d.label + '">' + (d.suffix ? '<b>' + d.suffix + '</b>' : '') + '</span></label>'; });
    html += '<button type="button" class="reset">Reset</button><span class="derived" hidden></span>';
    box.innerHTML = html;
    var inputs = {}; box.querySelectorAll("input").forEach(function (el) { inputs[el.getAttribute("data-k")] = el; el.addEventListener("input", onChange); el.addEventListener("blur", function () { el.value = get(el.getAttribute("data-k")); onChange(); }); });
    box.querySelector(".reset").addEventListener("click", function () { defs.forEach(function (d) { inputs[d.k].value = d.v; }); onChange(); });
    function get(k) { var el = inputs[k], v = parseFloat(el.value); if (isNaN(v)) v = +el.defaultValue; return Math.min(+el.max, Math.max(+el.min, v)); }
    return { get: get, derived: function (s) { var el = box.querySelector(".derived"); el.hidden = !s; el.textContent = s || ""; } };
  }
  function hatch(id, color) { return '<defs><pattern id="' + id + '" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="' + color + '" stroke-width="1" opacity="0.5"/></pattern></defs>'; }

  /* ================= Checks that find nothing ================= */
  (function () {
    var C = CASE.span;
    var CU = caseUI("spanCase", [
      { k: "reports", label: "Direct reports", v: C.reports, min: 1, max: 40, step: 1 },
      { k: "oto", label: "A one-to-one takes", v: C.oto, min: 5, max: 180, step: 5, suffix: "min" },
      { k: "review", label: "A monthly review takes", v: C.review, min: 0, max: 240, step: 5, suffix: "min" },
      { k: "group", label: "Group meetings a week", v: C.group, min: 0, max: 20, step: 0.5, suffix: "h" },
      { k: "week", label: "Your working week", v: C.week, min: 20, max: 90, step: 1, suffix: "h" }
    ], function () { render(); });

    /* The note puts no number on how often something comes up; it says most weeks, for most
       of your people, nothing has. That is what a rate below one a week means, so the slider
       starts at one a month and the reader moves it. It is a property of the work, not of
       the person: nothing here grades anybody.

       A raised item is charged at the same length as a one-to-one. That is almost certainly
       too generous to the interrupt side's cost, which is the safe direction to be wrong in:
       if interrupts still come out cheaper on a conservative charge, the argument holds. */
    var WEEKS_PER_MONTH = 4.345;
    function model() {
      var n = CU.get("reports"), oto = CU.get("oto") / 60, group = CU.get("group");
      var rate = +$("spRate").value;
      var p = Math.min(1, rate / WEEKS_PER_MONTH);          /* chance a given person has something, in a given week */
      var hit = n * p, miss = n - hit;                       /* scheduled checks that find something, and that do not */
      var reviews = n * (CU.get("review") / 60) / WEEKS_PER_MONTH;
      return {
        n: n, p: p, rate: rate, hit: hit, miss: miss, oto: oto, reviews: reviews, group: group,
        hitH: hit * oto, missH: miss * oto,
        polled: n * oto + reviews + group,                   /* check everyone, every week, whatever is happening */
        interrupt: hit * oto + group                          /* pay only for what was actually raised */
      };
    }

    function round1(v) { return Math.round(v * 10) / 10; }
    function shown(M) {
      var p = [round1(M.hitH), round1(M.missH), round1(M.reviews), round1(M.group)];
      return { parts: p, polled: round1(p[0] + p[1] + p[2] + p[3]), interrupt: round1(p[0] + p[3]) };
    }

    function render() {
      var M = model(), SH = shown(M), week = CU.get("week");
      var share = SH.polled / week * 100, saved = round1(SH.polled - SH.interrupt);
      var wasted = M.n > 0 ? M.miss / M.n * 100 : 0;
      $("spRateOut").textContent = M.rate === 0 ? "never" : (M.rate === 1 ? "once a month" : f1(M.rate) + " times a month");

      /* The week in half-hour slots. The pale cells are scheduled checks that found nothing,
         which is the whole of the polling argument: you pay for them either way. */
      var GAP = 2, X0 = 26, Y0 = 30, AVAIL = 313;
      var perDay = Math.max(8, Math.min(30, Math.round(week * 2 / 5)));
      var CELL = Math.max(5, Math.min(18, (AVAIL - (perDay - 1) * GAP) / perDay));
      var vbH = Math.ceil(Y0 + 5 * CELL + 4 * GAP + 8);
      function cellsFor(h) { return Math.max(0, Math.round(h * 2)); }
      var bands = [
        { n: cellsFor(M.hitH), op: 0.85 },      /* a check that found something */
        { n: cellsFor(M.missH), op: 0.28 },     /* a check that found nothing: paid for, and the point of the exhibit, so it has to stay clearly distinct from an empty slot */
        { n: cellsFor(M.reviews), op: 0.45 },
        { n: cellsFor(M.group), op: 0, flat: true }
      ];
      var order = [];
      for (var sl = 0; sl < perDay; sl++) for (var dy = 0; dy < 5; dy++) order.push([dy, sl]);
      order.sort(function (a, b) { return (a[1] % 3) - (b[1] % 3) || a[1] - b[1] || a[0] - b[0]; });
      var fill = {}, idx = 0;
      bands.forEach(function (bd) {
        for (var k = 0; k < bd.n && idx < order.length; k++, idx++) fill[order[idx][0] + ":" + order[idx][1]] = bd;
      });
      var s = '<svg viewBox="0 0 345 ' + vbH + '" role="img" aria-label="a working week as half-hour slots: the scheduled checks that found something, the ones that found nothing, and what is left">';
      s += txt(0, 12, "your week, in half hours", 9.5, { opacity: 0.6 });
      var LABS = ["M", "T", "W", "T", "F"];
      for (var d = 0; d < 5; d++) {
        var y = Y0 + d * (CELL + GAP);
        s += txt(16, y + CELL * 0.74, LABS[d], 9.5, { opacity: 0.5, anchor: "end" });
        for (var c = 0; c < perDay; c++) {
          var x = X0 + c * (CELL + GAP), bd = fill[d + ":" + c];
          var box = '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + CELL.toFixed(1) + '" height="' + CELL.toFixed(1) + '" rx="1.5" ';
          if (!bd) s += box + 'fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.22"/>';
          else if (bd.flat) s += box + 'fill="currentColor" opacity="0.15"/>';
          else s += box + 'fill="' + ACCENT + '" opacity="' + bd.op + '"/>';
        }
      }
      s += "</svg>";
      $("spanSvg").innerHTML = s;

      ticker("spanTick", [
        ["Scheduled checking", f1(SH.polled) + "h", "acc"],
        ["Of your week", Math.round(share) + "%"],
        ["Found nothing", Math.round(wasted) + "%"],
        ["If raised instead", f1(SH.interrupt) + "h"]
      ]);

      spine("spanSpine", "What a week of checking buys", [
        ["Scheduled checks a week", f1(M.n)], "−",
        ["That find something", f1(round1(M.hit))], "=",
        ["That find nothing", f1(round1(M.n - M.hit)), "out"]
      ]);

      $("spanCard").innerHTML =
        tile("Direct reports", String(M.n), "unchanged", "flat") +
        tile("Scheduled checking", f1(SH.polled) + "h", Math.round(share) + "% of the week", share >= 25 ? "bad" : "flat") +
        stamp("The diary", share >= 25 ? "Full" : "Manageable", share >= 25 ? "warn" : "good",
          wasted >= 50 ? "most checks find nothing" : "most checks find something");

      working("spanW", [
        "a scheduled check is charged whether or not anything has changed: " + M.n + " × " + CU.get("oto") + "min = " + f1(round1(M.n * M.oto)) + "h, plus the monthly reviews and the group meetings",
        "a person has something worth raising about " + (M.rate === 1 ? "once" : f1(M.rate) + " times") + " a month, so in any week that is " + Math.round(M.p * 100) + "% of them: " + f1(round1(M.hit)) + " of " + M.n + " checks land on something and " + f1(round1(M.miss)) + " do not",
        "raised instead of scheduled, you pay for the " + f1(round1(M.hit)) + " and nothing for the rest, which is " + f1(SH.interrupt) + "h against " + f1(SH.polled) + "h",
        "a raised item is charged at a full one-to-one, which overstates it, and the monthly reviews come off the interrupt week because the pack read properly covers everyone at once",
        "the note puts no number on how often something comes up, only that most weeks, for most people, nothing has; the slider is yours to set",
        "the grid is your week in half-hour slots, and where the cells fall is drawn for legibility rather than taken from a diary"
      ], C.essay);

      $("spanRead").innerHTML = "Checking everyone every week costs <span class=\"n\">" + f1(SH.polled) + "h</span>, of which <span class=\"n\">" + Math.round(wasted) + "%</span> of the checks find nothing.";
    }
    on(["spRate"], function () { render(); }); render();
  })();

  /* tell the page that embeds this how tall to make the frame */
  (function () {
    var last = 0;
    function report() {
      var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (h && Math.abs(h - last) > 2) { last = h; try { parent.postMessage({ instrument: "checking-in", height: h }, "*"); } catch (e) {} }
    }
    window.addEventListener("load", report);
    window.addEventListener("resize", report);
    if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
    setTimeout(report, 120); setTimeout(report, 600);
  })();
})();
</script>
</body>
</html>
