<style>

* { box-sizing: border-box; }

.standfirst { margin: 0; color: var(--ink-soft); font-size: 1rem; max-width: 36em; }

/* the three layers: the card, the tool, the working. No labels and no stamp; the dashed border and the duller colours are what say quoted */
.layer { display: flex; flex-direction: column; gap: 0.6rem; }

/* layer one: the pack, quoted rather than endorsed */
.card { display: grid; gap: 0.6rem 1rem; padding: 0.9rem 1rem; background: var(--panel); border: 1px dashed var(--rule-firm); border-radius: 6px; font-family: var(--sans); max-width: 430px; }
.card.c2 { grid-template-columns: 1fr 1fr; } .card.c3 { grid-template-columns: 1fr 1fr 1fr; } .card.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
@media (max-width: 480px) { .card.c4 { grid-template-columns: 1fr 1fr; } }
.card .k { display: block; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 0.15rem; }

.card .d { display: inline-block; margin-top: 0.25rem; font-size: 0.78rem; font-weight: 600; padding: 0.1rem 0.45rem; border-radius: 3px; font-variant-numeric: tabular-nums; }
.card .d.good { color: var(--good); background: var(--good-bg); } .card .d.bad { color: var(--bad); background: var(--bad-bg); } .card .d.flat { color: var(--ink-soft); background: var(--rule); }

.case .in b { font-weight: 500; color: var(--ink-mute); }

.stage input { width: 100%; text-align: center; padding: 0.3rem 0.2rem; }

.tool { display: flex; flex-direction: column; gap: 0.9rem; max-width: 430px; }
.tool svg { width: 100%; height: auto; display: block; color: var(--ink); overflow: hidden; }
.tool svg text { font-family: var(--sans); }
button:focus-visible, nav.contents a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.controls { display: flex; flex-direction: column; gap: 0.4rem; }

.control label output, .control label b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.control .aside { color: var(--ink-mute); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer; touch-action: pan-y; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: var(--rule); border-radius: 2px; }
input[type="range"]::-moz-range-track { height: 3px; background: var(--rule); border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; margin-top: -11.5px; border-radius: 50%; background: var(--accent); border: 3px solid var(--thumb-ring); box-shadow: 0 0 0 1px var(--accent); }
input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 3px solid var(--thumb-ring); box-shadow: 0 0 0 1px var(--accent); }
input[type="range"]:focus-visible { outline: none; }
input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }
input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 0.35rem; font-family: var(--sans); font-size: 0.85rem; }
.seg label { border: 1px solid var(--rule); border-radius: 4px; padding: 0.5rem 0.75rem; cursor: pointer; color: var(--ink-soft); min-height: 44px; display: flex; align-items: center; background: var(--field); }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg input:checked + span { color: var(--ink); font-weight: 600; }

/* the first counter can grow a note beside it mid-run, so on a narrow column it keeps a row to itself and nothing below it moves */
@media (max-width: 520px) { #bnTick > div:first-child { flex-basis: 100%; } }
.readout { font-family: var(--serif); font-size: 1.05rem; line-height: 1.55; color: var(--ink); font-variant-numeric: tabular-nums; border-left: 2px solid var(--accent); padding-left: 0.85rem; }
.readout .n { font-weight: 600; }
/* a readout that only restates numbers already on screen is kept for screen readers and hidden from sight (AP, 2026-10-10: keep text inside the tools to a minimum) */
.readout.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.btn { font: inherit; font-family: var(--sans); font-size: 0.85rem; font-weight: 500; color: var(--accent-text); background: none; border: 1px solid var(--accent); border-radius: 4px; padding: 0.55rem 0.8rem; min-height: 44px; cursor: pointer; }
.btn.quiet { color: var(--ink-soft); border-color: var(--rule); }
/* funnel stages */
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem; font-family: var(--sans); font-size: 0.8rem; }
.stage { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem 0.5rem; align-items: end; min-width: 0; }
.stage .nm { grid-column: 1 / -1; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; color: var(--ink); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage .fld { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
.stage .fld > span { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.02em; line-height: 1.25; color: var(--ink-mute); text-wrap: balance; }
.stage .fld .in { display: flex; align-items: center; gap: 0.2rem; }
.stage .fld b { font-size: 0.7rem; font-weight: 500; color: var(--ink-mute); white-space: nowrap; }
.stage-note { margin: 0; font-family: var(--sans); font-size: 0.8rem; line-height: 1.45; color: var(--ink-soft); }
.stage-note b { color: var(--ink); font-weight: 600; }
.stage input { font: inherit; font-family: var(--sans); font-size: 0.9rem; font-weight: 600; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 4px; padding: 0.3rem 0.4rem; width: 100%; min-width: 0; min-height: 36px; font-variant-numeric: tabular-nums; text-align: right; -moz-appearance: textfield; }
.stage input::-webkit-inner-spin-button { -webkit-appearance: none; }
.stage input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 480px) { .stages { grid-template-columns: 1fr; gap: 0.7rem; } .stage input { font-size: 16px; } }
.gate-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; font-family: var(--sans); font-size: 0.85rem; color: var(--ink-soft); }

.board { overflow-x: auto; font-family: var(--sans); font-size: 0.8rem; max-width: 430px; }
.board table { border-collapse: collapse; width: 100%; min-width: 330px; font-variant-numeric: tabular-nums; }
.board th, .board td { padding: 0.3rem 0.4rem; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
.board th:first-child, .board td:first-child { text-align: left; color: var(--ink-mute); font-weight: 500; padding-left: 0; }
.board thead th { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-mute); border-bottom: 1px solid var(--rule-firm); }
.board thead th.on { color: var(--accent-text); }
.board tr.worth td { font-weight: 600; font-size: 0.95rem; border-bottom: 0; padding-top: 0.45rem; }
.board td.on { color: var(--accent-text); }

/* layer three: the working */
details.working { border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); max-width: 430px; font-family: var(--sans); }
details.working summary { cursor: pointer; padding: 0.7rem 1rem; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); list-style: none; }
details.working summary::-webkit-details-marker { display: none; }

details.working[open] summary::before { content: "−"; }
details.working .w { padding: 0 1rem 0.9rem; font-family: var(--mono); font-size: 0.8rem; line-height: 1.6; color: var(--ink-soft); }
details.working .w p { margin: 0 0 0.5rem; }
details.working .w p:last-child { margin: 0; }
/* the spine: the one line of arithmetic the tool turns on, kept in the open rather
   than folded into the working. Every term is named in words and carries its live
   number, so a reader who never opens the drawer still sees what drives the answer.
   Taken from john.fun/elevators, whose scoring panel does the same for its optimiser. */
.spine { max-width: 430px; font-family: var(--sans); border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); padding: 0.7rem 0.85rem 0.75rem; }
.spine .lbl { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 0.5rem; }
.spine .row { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0.3rem; }
.spine .term { display: flex; flex-direction: column; justify-content: center; gap: 0.1rem; padding: 0.3rem 0.5rem; border: 1px solid var(--rule); border-radius: 4px; background: var(--field); min-width: 0; }
.spine .term .t { font-size: 0.64rem; font-weight: 600; letter-spacing: 0.03em; line-height: 1.2; color: var(--ink-mute); }
.spine .term .v { font-size: 0.92rem; font-weight: 600; line-height: 1.2; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.spine .op { align-self: center; font-size: 0.9rem; font-weight: 500; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
.spine .term.out { border-color: var(--accent); background: var(--accent-soft); }
.spine .term.out .t, .spine .term.out .v { color: var(--accent-text); }

/* the ticker: counters that move while the clock runs, so a figure arrives as
   something the reader watched accumulate rather than a number already on the page */
.ticker { display: flex; flex-wrap: wrap; gap: 0.55rem 1.2rem; max-width: 430px; font-family: var(--sans); }
.ticker > div { display: flex; flex-direction: column; gap: 0.05rem; min-width: 0; }
.ticker .k { font-size: 0.64rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-mute); white-space: nowrap; }
.ticker .v { font-size: 1.05rem; font-weight: 600; line-height: 1.2; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ticker .v.acc { color: var(--accent-text); }
.ticker .v .was { font-size: 0.78rem; font-weight: 500; color: var(--ink-soft); }

/* the clock: user-started, never autoplaying, because these sit inside somebody's reading */
.runbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; max-width: 430px; font-family: var(--sans); font-size: 0.85rem; color: var(--ink-soft); }
.runbar .btn { min-height: 40px; padding: 0.45rem 0.9rem; }
.runbar .seg label { min-height: 40px; padding: 0.4rem 0.6rem; }
.runbar .clock { margin-left: auto; font-variant-numeric: tabular-nums; }
@media (max-width: 430px) {
  .spine { padding: 0.6rem 0.65rem 0.65rem; }
  .spine .lbl { margin-bottom: 0.4rem; }
  .spine .row { gap: 0.25rem; }
  .spine .term { padding: 0.25rem 0.4rem; }
  .spine .term .t { font-size: 0.6rem; }
  .spine .term .v { font-size: 0.86rem; }
  .ticker { gap: 0.45rem 0.9rem; }
  .ticker .v { font-size: 0.98rem; }
  .runbar { gap: 0.35rem; }
  .runbar .btn { padding: 0.45rem 0.7rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>html.hosted body { background: transparent; } html:not(.hosted) .sheet { padding: 0.9rem 0.85rem 1rem; } .sheet { padding: 0.2rem 0 0.4rem; max-width: none; } section { gap: 0.9rem; } .card, .board, .tool, details.working, .case, .stages, .stage-note { max-width: none; } .tool > div[id$="Svg"] { max-width: 560px; } .controls, .control, .seg, .readout, .spine, .ticker, .runbar { max-width: 620px; } @media (max-width: 560px) { .tool > div[id$="Svg"] { max-width: none; } } .solo-head { display: none; } html.solo .solo-head { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 1.5rem; } html.solo .sheet { max-width: 42rem; margin: 0 auto; padding: 1.75rem 1.1rem 3rem; } .solo-head h1 { margin: 0; } .solo-head .from { font-family: var(--sans); font-size: 0.9rem; color: var(--ink-soft); } .solo-head .from a { color: var(--accent-text); text-decoration: none; border-bottom: 1px solid var(--accent-soft); } .solo-head .from a:hover { border-color: var(--accent); } .solo-head a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; } .card .row, .board { scrollbar-width: thin; scrollbar-color: var(--rule-firm) transparent; }</style>

<body>
<div class="sheet">
<header class="solo-head"><p class="eyebrow">Thinking tool</p><h1>The pile in front of one person</h1><p class="standfirst">Work that only one person can do is arriving faster than they can get to it. Try the three steps in any order, and run the year.</p><p class="from">The thinking behind it is in <a href="https://anishpatel.co/Notes/Human+bottlenecks" target="_top">Human bottlenecks</a>.</p></header>
<section id="bn">
    <div class="layer">
      <div class="tool">
        <div id="bnSvg"></div>
        <div class="ticker" id="bnTick"></div>
        <div class="seg" role="group" aria-label="Three steps to try">
          <label><input type="checkbox" id="bnClear"><span>Clear their desk</span></label>
          <label><input type="checkbox" id="bnHold" disabled><span>Let other work wait</span></label>
          <label><input type="checkbox" id="bnAdd"><span>Add a second person</span></label>
        </div>
        <div class="runbar">
          <button type="button" class="btn" id="bnRun">Run the year</button>
          <span class="clock" id="bnClock"></span>
        </div>
        <div class="spine" id="bnSpine"></div>
        <p class="readout sr" id="bnRead" aria-live="polite"></p>
      </div>
    </div>
    <details class="working"><summary>The working</summary><div class="w" id="bnW"></div></details>
  </section>
</div>
<script>(function () { var root = document.documentElement; function apply(t) {  if (t !== "dark" && t !== "light") return;  root.setAttribute("data-theme", t);  root.classList.add("hosted"); } addEventListener("message", function (e) { if (e.data && e.data.publishTheme) apply(e.data.publishTheme); }); try { var m = /[?&]theme=(dark|light)/.exec(location.search); if (m) apply(m[1]); } catch (e) {} try { parent.postMessage({ instrumentReady: true }, "*"); } catch (e) {}})();</script>
<script>
(function () {
  var CASE = {

    bn:  { week: 40, own: 16, arrive: 3, start: 10, clear: 8, drift: 0.5, show: 8, learn: 26, second: 16, weeks: 52 }
  };

  /* ---------- helpers ---------- */
  var ACCENT = "var(--accent)";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function txt(x, y, s, size, o) {
    o = o || {}; size = Math.max(size, 10.5); if (o.opacity && o.opacity < 0.6) o.opacity = 0.6;
    return '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" font-size="' + size + '"' + (o.weight ? ' font-weight="' + o.weight + '"' : '') +
      ' fill="' + (o.fill || 'currentColor') + '"' + (o.opacity ? ' opacity="' + o.opacity + '"' : '') + (o.anchor ? ' text-anchor="' + o.anchor + '"' : '') + '>' + esc(s) + '</text>';
  }
  function setRange(id, range, value) { var el = $(id); el.min = range[0]; el.max = range[1]; el.step = range[2]; el.value = value; }
  function roundHalfEven(x) { x = Math.round(x * 1e6) / 1e6; var t = Math.trunc(x), f = Math.abs(x - t); if (Math.abs(f - 0.5) < 1e-9) return (t % 2 === 0) ? t : t + (x < 0 ? -1 : 1); return Math.round(x); }
  function poundsM1(v) { var a = Math.abs(v); if (a >= 1000) return "£" + (Math.round(a / 100) / 10).toFixed(1) + "bn"; if (a >= 100) return "£" + Math.round(a) + "m"; return "£" + f1(a) + "m"; }
  function poundsM(v) { var a = Math.abs(v); if (a >= 1000) return "£" + (Math.round(a / 100) / 10).toFixed(1) + "bn"; return "£" + roundHalfEven(a) + "m"; }
  function poundsK(v) { var sign = v < 0 ? "−" : "+"; var a = Math.abs(v); if (a >= 1000) return sign + "£" + (Math.round(a / 100) / 10).toFixed(1) + "m"; return sign + "£" + Math.round(a / 10) * 10 + "k"; }
  function pct1(x) { var v = Math.round(x * 10) / 10; return (v === Math.round(v) ? String(Math.round(v)) : v.toFixed(1)) + "%"; }
  function gbp(v) { var sign = v < 0 ? "−" : ""; var a = Math.abs(v); if (a >= 1e6) return sign + "£" + (Math.round(a / 1e5) / 10).toFixed(1) + "m"; return sign + "£" + Math.round(a).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function gbpBig(v) { var sign = v < 0 ? "−" : ""; var a = Math.abs(v); if (a >= 1e8) return sign + "£" + Math.round(a / 1e6) + "m"; if (a >= 1e6) return sign + "£" + f1(a / 1e6) + "m"; if (a >= 1e3) return sign + "£" + Math.round(a / 1e3) + "k"; return sign + "£" + Math.round(a); }
  function f1(x) { var v = Math.round(x * 10) / 10; return v === Math.round(v) ? String(Math.round(v)) : v.toFixed(1); }
  var WORDS = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve"];
  function word(n) { return n >= 0 && n <= 12 && n === Math.round(n) ? WORDS[n] || "no" : String(n); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function plural(n, one, many) { many = many || one + "s"; var w = word(n); return (n === 0 ? "no" : w) + " " + (n === 1 ? one : many); }
  function months(x) { if (x > 40 * 12) return "over 40 years"; if (x >= 24) { var yv = Math.round(x / 6) / 2; return (yv === Math.round(yv) ? String(Math.round(yv)) : yv.toFixed(1)) + " years"; } if (x < 0.25) return "under a week"; if (x < 0.75) return "about a fortnight"; if (x < 1) return "under a month"; if (x >= 9.95) return Math.round(x) + " months"; var r = Math.round(x * 10) / 10; var s = Math.abs(r - Math.round(r)) < 1e-9 ? String(Math.round(r)) : r.toFixed(1); return s + (s === "1" ? " month" : " months"); }
  function chance(p) { if (p >= 0.5) return "more often than not"; if (p < 0.005) return "less than one time in 200"; var d = 1 / p; d = d > 20 ? Math.round(d / 10) * 10 : Math.round(d); return "about one time in " + (d <= 12 ? WORDS[d] : d); }
  function makeRng(seed) { var a = seed >>> 0; return function () { a += 0x6D2B79F5; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function normal(rng) { var u1 = rng() || 1e-12, u2 = rng(); return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2); }
  var LF = [0, 0];
  function lnfact(n) { while (LF.length <= n) LF.push(LF[LF.length - 1] + Math.log(LF.length)); return LF[n]; }
  function binomPmf(n, k, p) { if (p <= 0) return k === 0 ? 1 : 0; if (p >= 1) return k === n ? 1 : 0; return Math.exp(lnfact(n) - lnfact(k) - lnfact(n - k) + k * Math.log(p) + (n - k) * Math.log(1 - p)); }
  function fmtNum(x, dp) { var s = x.toFixed(dp); var parts = s.split("."); parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); return parts.join("."); }
  function on(ids, fn) { ids.forEach(function (id) { $(id).addEventListener("input", fn); }); }
  function onRadios(name, fn) { document.querySelectorAll('input[name="' + name + '"]').forEach(function (el) { el.addEventListener("change", fn); }); }
  function radio(name) { var el = document.querySelector('input[name="' + name + '"]:checked'); return el ? el.value : ""; }
  function seg(id, name, items, checked) { $(id).innerHTML = items.map(function (it) { return '<label><input type="radio" name="' + name + '" value="' + it[0] + '"' + (String(it[0]) === String(checked) ? " checked" : "") + '><span>' + it[1] + '</span></label>'; }).join(""); }
  function tile(k, v, d, cls) { return '<div><span class="k">' + k + '</span><span class="v">' + v + '</span>' + (d ? '<span class="d ' + (cls || "flat") + '">' + d + '</span>' : '') + '</div>'; }
  function tag(t, cls) { return '<span class="tag ' + cls + '">' + t + '</span>'; }
  function stamp(k, t, cls, note) { return '<div><span class="k">' + k + '</span><span class="v">' + tag(t, cls) + '</span>' + (note ? '<span class="note">' + note + '</span>' : '') + '</div>'; }
  function working(id, lines) { $(id).innerHTML = lines.map(function (l) { return "<p>" + l + "</p>"; }).join(""); }
  /* the spine. Terms in order: a string is an operator, a pair is [name, live value],
     a third member is a class, and "out" marks the answer the equation arrives at.
     Labels and numbers only: the argument belongs in the Note, not in the tool. */
  function spine(id, label, terms) {
    var h = '<p class="lbl">' + label + '</p><div class="row">';
    terms.forEach(function (t) {
      if (typeof t === "string") { h += '<span class="op">' + t + '</span>'; return; }
      h += '<span class="term' + (t[2] ? " " + t[2] : "") + '"><span class="t">' + t[0] + '</span><span class="v">' + t[1] + '</span></span>';
    });
    $(id).innerHTML = h + '</div>';
  }
  function ticker(id, items) {
    $(id).innerHTML = items.map(function (it) {
      return '<div><span class="k">' + it[0] + '</span><span class="v' + (it[2] ? " " + it[2] : "") + '">' + it[1] + '</span></div>';
    }).join("");
  }
  function caseUI(id, defs, onChange) {
    var box = $(id), html = '<span class="case-label">The case</span>';
    defs.forEach(function (d) { html += '<label class="cf"><span>' + d.label + '</span><span class="in">' + (d.prefix ? '<b>' + d.prefix + '</b>' : '') + '<input type="number" inputmode="decimal" data-k="' + d.k + '" value="' + d.v + '" min="' + d.min + '" max="' + d.max + '" step="' + (d.step || "any") + '" aria-label="' + d.label + '">' + (d.suffix ? '<b>' + d.suffix + '</b>' : '') + '</span></label>'; });
    html += '<button type="button" class="reset">Reset</button><span class="derived" hidden></span>';
    box.innerHTML = html;
    var inputs = {}; box.querySelectorAll("input").forEach(function (el) { inputs[el.getAttribute("data-k")] = el; el.addEventListener("input", onChange); el.addEventListener("blur", function () { el.value = get(el.getAttribute("data-k")); onChange(); }); });
    box.querySelector(".reset").addEventListener("click", function () { defs.forEach(function (d) { inputs[d.k].value = d.v; }); onChange(); });
    function get(k) { var el = inputs[k], v = parseFloat(el.value); if (isNaN(v)) v = +el.defaultValue; return Math.min(+el.max, Math.max(+el.min, v)); }
    return { get: get, derived: function (s) { var el = box.querySelector(".derived"); el.hidden = !s; el.textContent = s || ""; } };
  }
  function hatch(id, color) { return '<defs><pattern id="' + id + '" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="' + color + '" stroke-width="1" opacity="0.5"/></pattern></defs>'; }

  /* ================= The pile in front of one person ================= */
  (function () {
    var C = CASE.bn, WEEKS = C.weeks, DAY = 8, SPEED = 10;   /* weeks a second: a year in about five */

    /* One year, week by week, for one person and the work only they can do. Nothing is drawn
       at random: the note's claims here turn on delay, not chance.

       Clearing their desk moves hours onto that work. Unless other work is left to wait, the
       cleared hours come back a little each week, which is the note's "drifts back onto the
       bottleneck's desk". A second person has to be shown the work by the first, so for as
       long as that takes the showing comes out of the first person's hours on it, and the
       second person's share of the work builds from nothing.

       Every figure is in the person's hours or in days of their work. Nothing here measures
       how good anybody is at it. */
    function path(clear, hold, add) {
      var rows = [], pile = C.start;
      for (var k = 1; k <= WEEKS; k++) {
        var cleared = clear ? (hold ? C.clear : Math.max(0, C.clear - C.drift * (k - 1))) : 0;
        var show = add && k <= C.learn ? C.show : 0;
        var own = C.own + cleared - show;                               /* their hours for the work only they can do */
        var second = add ? C.second * Math.min(1, k / C.learn) : 0;    /* the second person's hours on it so far */
        var avail = pile + C.arrive, done = Math.min((own + second) / DAY, avail);
        var by2 = Math.min(second / DAY, done), by1 = done - by2;
        pile = Math.max(0, Math.round((avail - done) * 1e6) / 1e6);
        /* once they have hours to spare, the work that was left to wait comes back before any hour stands free */
        var free = own - by1 * DAY, back = Math.min(free, cleared);
        rows.push({ pile: pile, held: cleared - back, show: show, own: by1 * DAY, free: free - back, second: by2 * DAY, by1: by1, by2: by2 });
      }
      return rows;
    }

    var BASE = path(false, false, false), P = BASE, S = { clear: false, hold: false, add: false };
    var timer = null, T = WEEKS;
    var still = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

    function days(v) { var r = Math.round(v * 10) / 10; return r === 0 ? "nothing" : f1(r) + (r === 1 ? " day" : " days"); }
    function whole(v) { var r = Math.round(v); return r === 0 ? "nothing" : r + (r === 1 ? " day" : " days"); }
    function shownWeeks() { return Math.min(WEEKS, Math.floor(T + 1e-9)); }
    function pileAt(n) { return n ? P[n - 1].pile : C.start; }
    function plain() { return !S.clear && !S.add; }

    function draw() {
      var n = shownWeeks(), w = P[Math.max(1, n) - 1];
      var CELL = 13, PIT = 15, GX = 22, G2 = 200, GY = 20, gridB = GY + 5 * PIT - 2;
      var BP = 5.8, BW = 4.2, YB = 234, vbH = YB + 18;
      function X(k) { return GX + (k - 1) * BP; }
      function Y(d) { return YB - d; }                                /* one unit a day of work */

      function grid(x0, bands, letters) {
        var seq = [], g = "", i = 0;
        bands.forEach(function (b) { for (var q = 0; q < b[0]; q++) seq.push(b); });
        for (var d = 0; d < 5; d++) {
          var y = GY + d * PIT;
          if (letters) g += txt(x0 - 6, y + CELL * 0.8, "MTWTF".charAt(d), 10.5, { opacity: 0.6, anchor: "end" });
          for (var c = 0; c < 8; c++, i++) {
            var b = seq[i], box = '<rect x="' + (x0 + c * PIT) + '" y="' + y + '" width="' + CELL + '" height="' + CELL + '" rx="1.5" ';
            if (!b || !b[1]) g += box + 'fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.22"/>';
            else g += box + 'fill="' + b[1] + '" opacity="' + b[2] + '"/>';
          }
        }
        return g;
      }

      var LABEL = "one person's week in hours, and the days of work waiting for them, week by week over a year";
      var s = '<svg viewBox="0 0 345 ' + vbH + '" role="img" aria-label="' + LABEL + '">';

      /* The week fills a row at a time, so a day of the work reads as a row: two rows at the
         start, three once the desk is cleared, one of them given to showing the second person. */
      var own = Math.round(w.own), show = Math.round(w.show), free = Math.round(w.free);
      s += txt(GX, 12, "their week, in hours", 10.5, { opacity: 0.6 });
      s += grid(GX, [[own, ACCENT, 0.85], [show, ACCENT, 0.28], [C.week - own - show - free, "currentColor", 0.15], [free, null]], true);
      if (S.add) {
        s += txt(G2, 12, "the second person's week", 10.5, { opacity: 0.6 });
        s += grid(G2, [[Math.round(w.second), ACCENT, 0.85]], false);
      }

      /* the key: three swatches, in the same places whichever moves are on */
      var KEY = [[GX, gridB + 15, "the work only they can do", ACCENT, 0.85], [GX + 172, gridB + 15, "everything else", "currentColor", 0.15], [GX, gridB + 30, "showing the second person", ACCENT, 0.28]];
      KEY.forEach(function (k, i) {
        if (i === 2 && !S.add) return;
        s += '<rect x="' + k[0] + '" y="' + (k[1] - 8) + '" width="8" height="8" rx="1.5" fill="' + k[3] + '" opacity="' + k[4] + '"/>';
        s += txt(k[0] + 11, k[1], k[2], 10.5, { opacity: 0.65 });
      });

      /* The pile, a bar a week. The red pen is whatever stands above the line the pile would
         have followed with nothing changed: the weeks a move has made things worse. */
      s += txt(GX, YB - 86, "days of work waiting for them, week by week", 10.5, { opacity: 0.6 });
      if (!plain()) {
        s += '<line x1="' + (X(1) + BW / 2).toFixed(1) + '" y1="' + Y(BASE[0].pile).toFixed(1) + '" x2="' + (X(WEEKS) + BW / 2).toFixed(1) + '" y2="' + Y(BASE[WEEKS - 1].pile).toFixed(1) + '" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>';
        s += txt(X(WEEKS) - 4, Y(BASE[WEEKS - 1].pile) - 4, "if nothing changes", 10.5, { opacity: 0.6, anchor: "end" });
      }
      for (var k = 1; k <= n; k++) {
        var p = P[k - 1].pile, b = Math.min(p, BASE[k - 1].pile);
        if (b > 0) s += '<rect x="' + X(k).toFixed(1) + '" y="' + Y(b).toFixed(1) + '" width="' + BW + '" height="' + b.toFixed(1) + '" fill="currentColor" opacity="0.38"/>';
        if (p > b + 0.05) s += '<rect x="' + X(k).toFixed(1) + '" y="' + Y(p).toFixed(1) + '" width="' + BW + '" height="' + (p - b).toFixed(1) + '" fill="' + ACCENT + '"/>';
      }
      s += '<line x1="' + GX + '" y1="' + YB + '" x2="' + (X(WEEKS) + BW).toFixed(1) + '" y2="' + YB + '" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>';
      s += txt(X(Math.max(1, n)) + BW + 3, Math.min(YB - 1, Y(pileAt(n)) + 8), String(Math.round(pileAt(n))), 10.5, { opacity: 0.8 });
      s += txt(GX, YB + 13, "week 1", 10.5, { opacity: 0.6 });
      s += txt(X(WEEKS) + BW, YB + 13, "week " + WEEKS, 10.5, { opacity: 0.6, anchor: "end" });
      s += "</svg>";
      $("bnSvg").innerHTML = s;
    }

    /* what moves while the clock runs: the counters, the clock, and the week's own arithmetic */
    function tick() {
      var n = shownWeeks(), w = P[Math.max(1, n) - 1], cur = pileAt(n), worst = C.start;
      for (var k = 1; k <= n; k++) worst = Math.max(worst, P[k - 1].pile);
      ticker("bnTick", [
        ["Waiting for them", whole(cur) + (Math.round(worst) > Math.round(cur) ? ' <span class="was">' + Math.round(worst) + " at its worst</span>" : ""), "acc"],
        ["At the start", whole(C.start)],
        ["Other work held up", w.held > 0 ? f1(w.held) + "h a week" : "none"]
      ]);
      $("bnClock").textContent = "week " + Math.max(1, n) + " of " + WEEKS;
      /* the answer is worked from the terms as shown, to a tenth, so the row always adds up */
      function tenth(v) { return Math.round(v * 10) / 10; }
      var net = tenth(C.arrive - tenth(w.by1) - tenth(w.by2)), terms = [["Work arriving", days(C.arrive)], "−", ["They get through", days(w.by1)]];
      if (S.add) terms.push("−", ["The second person", days(w.by2)]);
      terms.push("=", [net < -0.05 ? "Taken off the pile" : "Added to the pile", days(Math.abs(net)), "out"]);
      spine("bnSpine", "The pile, this week", terms);
    }

    /* everything that only changes when a run finishes */
    function settle() {
      draw(); tick();
      working("bnW", [
        "for illustration: a " + C.week + "-hour week with " + C.own + " hours on the work only they can do, " + days(C.arrive) + " of it arriving a week, and " + whole(C.start) + " waiting at the start",
        "clearing their desk moves " + C.clear + " hours a week onto it; unless other work is left to wait, those hours come back at an hour a fortnight",
        "a second person takes " + C.show + " hours a week of showing for six months, and by then does " + days(C.second / DAY) + " of the work a week"
      ]);
      var end = Math.round(pileAt(WEEKS));
      $("bnRead").innerHTML = "After a year, <span class=\"n\">" + (end ? whole(end) + " of work" : "no work") + "</span> is waiting for them, from " + whole(C.start) + " at the start.";
    }

    function stop() { if (timer) { clearInterval(timer); timer = null; } }
    function clock() { return (window.performance && performance.now) ? performance.now() : Date.now(); }

    /* A run plays the year from week one. Nothing plays until the reader presses a move or the
       button, and with reduced motion the year lands at once. A timer, not
       requestAnimationFrame, which stops dead in a tab that is not painting. */
    function run() {
      stop(); P = path(S.clear, S.hold, S.add);
      if (still) { T = WEEKS; settle(); return; }
      var last = clock(), seen = -1;
      T = 0;
      timer = setInterval(function () {
        var t = clock(); T += Math.min(0.1, (t - last) / 1000) * SPEED; last = t;
        if (T >= WEEKS) { T = WEEKS; stop(); settle(); return; }
        if (shownWeeks() !== seen) { seen = shownWeeks(); draw(); tick(); }
      }, 33);
      draw(); tick();
    }

    /* Leaving other work to wait only means something once there is cleared work to hold. */
    function moved() {
      S.clear = $("bnClear").checked;
      if (!S.clear) $("bnHold").checked = false;
      $("bnHold").disabled = !S.clear;
      S.hold = $("bnHold").checked; S.add = $("bnAdd").checked;
      run();
    }

    ["bnClear", "bnHold", "bnAdd"].forEach(function (id) { $(id).addEventListener("change", moved); });
    $("bnRun").addEventListener("click", run);
    settle();
  })();

  /* tell the page that embeds this how tall to make the frame */
  (function () {
    var last = 0;
    function report() {
      var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (h && Math.abs(h - last) > 2) { last = h; try { parent.postMessage({ instrument: "one-person", height: h }, "*"); } catch (e) {} }
    }
    window.addEventListener("load", report);
    window.addEventListener("resize", report);
    if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
    setTimeout(report, 120); setTimeout(report, 600);
  })();
})();
</script>
