/* the three layers: the card, the tool, the working. No labels and no stamp; the dashed border and the duller colours are what say quoted */

.stage .nm { grid-column: 1 / -1; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; color: var(--ink); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage .fld { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
.stage .fld > span { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.02em; line-height: 1.25; color: var(--ink-mute); text-wrap: balance; }
.stage .fld .in { display: flex; align-items: center; gap: 0.2rem; }
.stage .fld b { font-size: 0.7rem; font-weight: 500; color: var(--ink-mute); white-space: nowrap; }
.stage-note { margin: 0; font-family: var(--sans); font-size: 0.8rem; line-height: 1.45; color: var(--ink-soft); }
.stage-note b { color: var(--ink); font-weight: 600; }
.stage input { font: inherit; font-family: var(--sans); font-size: 0.9rem; font-weight: 600; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 4px; padding: 0.3rem 0.4rem; width: 100%; min-width: 0; min-height: 36px; font-variant-numeric: tabular-nums; text-align: right; -moz-appearance: textfield; }

.board table { border-collapse: collapse; width: 100%; min-width: 330px; font-variant-numeric: tabular-nums; }
.board th, .board td { padding: 0.3rem 0.4rem; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
.board th:first-child, .board td:first-child { text-align: left; color: var(--ink-mute); font-weight: 500; padding-left: 0; }
.board thead th { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-mute); border-bottom: 1px solid var(--rule-firm); }

</style>
<style>html.hosted body { background: transparent; } html:not(.hosted) .sheet { padding: 0.9rem 0.85rem 1rem; } .sheet { padding: 0.2rem 0 0.4rem; max-width: none; } section { gap: 0.9rem; } .card, .board, .tool, details.working, .case, .stages, .stage-note { max-width: none; } .tool > div[id$="Svg"] { max-width: 560px; } .controls, .control, .seg, .readout { max-width: 620px; } @media (max-width: 560px) { .tool > div[id$="Svg"] { max-width: none; } }</style>

  function normal(rng) { var u1 = rng() || 1e-12, u2 = rng(); return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2); }
  var LF = [0, 0];
  function lnfact(n) { while (LF.length <= n) LF.push(LF[LF.length - 1] + Math.log(LF.length)); return LF[n]; }
  function binomPmf(n, k, p) { if (p <= 0) return k === 0 ? 1 : 0; if (p >= 1) return k === n ? 1 : 0; return Math.exp(lnfact(n) - lnfact(k) - lnfact(n - k) + k * Math.log(p) + (n - k) * Math.log(1 - p)); }
  function fmtNum(x, dp) { var s = x.toFixed(dp); var parts = s.split("."); parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); return parts.join("."); }
  function on(ids, fn) { ids.forEach(function (id) { $(id).addEventListener("input", fn); }); }
  function onRadios(name, fn) { document.querySelectorAll('input[name="' + name + '"]').forEach(function (el) { el.addEventListener("change", fn); }); }
  function radio(name) { var el = document.querySelector('input[name="' + name + '"]:checked'); return el ? el.value : ""; }
  function seg(id, name, items, checked) { $(id).innerHTML = items.map(function (it) { return '<label><input type="radio" name="' + name + '" value="' + it[0] + '"' + (String(it[0]) === String(checked) ? " checked" : "") + '><span>' + it[1] + '</span></label>'; }).join(""); }
  function tile(k, v, d, cls) { return '<div><span class="k">' + k + '</span><span class="v">' + v + '</span>' + (d ? '<span class="d ' + (cls || "flat") + '">' + d + '</span>' : '') + '</div>'; }
  function tag(t, cls) { return '<span class="tag ' + cls + '">' + t + '</span>'; }
  function stamp(k, t, cls, note) { return '<div><span class="k">' + k + '</span><span class="v">' + tag(t, cls) + '</span>' + (note ? '<span class="note">' + note + '</span>' : '') + '</div>'; }
  function working(id, lines, essay) { $(id).innerHTML = lines.map(function (l) { return "<p>" + l + "</p>"; }).join("") + (essay ? '<p class="essay">' + esc(essay) + "</p>" : ""); }
  function caseUI(id, defs, onChange) {
    var box = $(id), html = '<span class="case-label">The case</span>';
    defs.forEach(function (d) { html += '<label class="cf"><span>' + d.label + '</span><span class="in">' + (d.prefix ? '<b>' + d.prefix + '</b>' : '') + '<input type="number" inputmode="decimal" data-k="' + d.k + '" value="' + d.v + '" min="' + d.min + '" max="' + d.max + '" step="' + (d.step || "any") + '" aria-label="' + d.label + '">' + (d.suffix ? '<b>' + d.suffix + '</b>' : '') + '</span></label>'; });
    html += '<button type="button" class="reset">Reset</button><span class="derived" hidden></span>';
    box.innerHTML = html;
    var inputs = {}; box.querySelectorAll("input").forEach(function (el) { inputs[el.getAttribute("data-k")] = el; el.addEventListener("input", onChange); el.addEventListener("blur", function () { el.value = get(el.getAttribute("data-k")); onChange(); }); });
    box.querySelector(".reset").addEventListener("click", function () { defs.forEach(function (d) { inputs[d.k].value = d.v; }); onChange(); });
    function get(k) { var el = inputs[k], v = parseFloat(el.value); if (isNaN(v)) v = +el.defaultValue; return Math.min(+el.max, Math.max(+el.min, v)); }
    return { get: get, derived: function (s) { var el = box.querySelector(".derived"); el.hidden = !s; el.textContent = s || ""; } };
  }
  function hatch(id, color) { return '<defs><pattern id="' + id + '" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="' + color + '" stroke-width="1" opacity="0.5"/></pattern></defs>'; }

  /* ================= 11. Road by road ================= */
  (function () {
    var C = CASE.density;
    var CU = caseUI("densityCase", [
      { k: "stops", label: "Your customers", v: C.stops, min: 10, max: 100000, step: 10 },
      { k: "rival", label: "Rival's customers, one patch", v: C.rival, min: 5, max: 100000, step: 5 }
    ], function () { render(); });
    $("dPatches").value = C.patches;
    function dots(x0, y0, size, n) {
      /* a square patch with up to 400 stops drawn as dots; past that the count under the square carries it */
      var shown = Math.min(n, 400), g = Math.max(1, Math.ceil(Math.sqrt(shown))), step = size / g, r = Math.min(1.8, step * 0.32), out = "";
      out += '<rect x="' + x0 + '" y="' + y0 + '" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>';
      for (var i = 0; i < shown; i++) { var cx = x0 + step * (i % g) + step / 2, cy = y0 + step * Math.floor(i / g) + step / 2; out += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r.toFixed(2) + '" fill="currentColor" opacity="0.8"/>'; }
      return out;
    }
    function render() {
      var S = CU.get("stops"), R = CU.get("rival"), k = +$("dPatches").value, per = S / k, ratio = Math.sqrt(R / per), mult = S / R;
      $("dPatchesOut").textContent = plural(k, "patch", "patches");
      working("densityW", [
        "cost to reach a customer in a patch ∝ √(area ÷ customers in that patch) <i>(the travelling-salesman result: the shortest route through n stops in an area grows with √(n × area), so the distance per stop falls with the square root of density)</i>",
        "patches are equal in size; your customers per patch = " + fmtNum(S, 0) + " ÷ " + k + " = " + fmtNum(per, per < 10 ? 1 : 0) + ", the rival's " + fmtNum(R, 0) + " in one patch",
        "your cost per customer against the rival's = √(" + fmtNum(R, 0) + " ÷ " + fmtNum(per, per < 10 ? 1 : 0) + ") = " + ratio.toFixed(2),
        "your total of " + fmtNum(S, 0) + " enters the arithmetic only through how thinly it's spread"
      ], C.essay);
      $("densityCard").innerHTML = tile("Customers", fmtNum(S, 0), mult >= 1.05 ? f1(mult) + "× the rival" : mult <= 0.95 ? f1(1 / mult) + "× fewer than the rival" : "level with the rival", mult >= 1.05 ? "good" : mult <= 0.95 ? "bad" : "flat")
        + tile("Markets served", String(k), k === 1 ? "one patch" : k + " patches", k > 1 ? "good" : "flat")
        + stamp("Position", mult > 1 ? "Market leader" : "Challenger", mult > 1 ? "good" : "warn", k === 1 ? "expand into new patches" : "national footprint the rival lacks");
      var sq = 24, gap = 4, x0 = 10, yTop = 30, s2 = '<svg viewBox="0 0 345 172" role="img" aria-label="Your customers spread across patches against a rival who keeps all of theirs in one, and what each of you spends reaching a customer">';
      s2 += txt(x0, 18, "you: " + fmtNum(S, 0) + " customers", 10.5, { opacity: 0.7 }); s2 += txt(335, 18, "rival: " + fmtNum(R, 0), 10.5, { opacity: 0.7, anchor: "end" });
      for (var i = 0; i < k; i++) { var px = x0 + i * (sq + gap); s2 += dots(px, yTop, sq, Math.round(per)); s2 += txt(px + sq / 2, yTop + sq + 12, fmtNum(per, per < 10 && per !== Math.round(per) ? 1 : 0), 10.5, { opacity: 0.6, anchor: "middle" }); }
      s2 += dots(335 - sq, yTop, sq, Math.round(R)); s2 += txt(335 - sq / 2, yTop + sq + 12, fmtNum(R, 0), 10.5, { opacity: 0.6, anchor: "middle" });
      /* the bars stay proportional at every setting: the rival's bar is the unit until yours would run off the edge, then both scale down together */
      var pct = Math.round(Math.abs(1 - ratio) * 100), level = Math.abs(ratio - 1) < 0.005;
      var youLbl = level ? "you, level" : ratio < 1 ? "you −" + pct + "%" : ratio < 2 ? "you +" + pct + "%" : "you ×" + f1(ratio);
      var bx = 10, by = 108, bh = 9, bw = Math.min(100, 250 / Math.max(ratio, 1)), yw = bw * ratio;
      s2 += txt(bx, 96, "what it costs to reach one customer", 10.5, { opacity: 0.7 });
      s2 += '<rect x="' + bx + '" y="' + by + '" width="' + bw.toFixed(1) + '" height="' + bh + '" fill="currentColor" opacity="0.3"/>'; s2 += txt(bx + bw + 6, by + bh - 1, "rival", 10.5, { opacity: 0.7 });
      s2 += '<rect x="' + bx + '" y="' + (by + 18) + '" width="' + yw.toFixed(1) + '" height="' + bh + '" fill="' + ACCENT + '"/>'; s2 += txt(bx + yw + 6, by + 18 + bh - 1, youLbl, 10.5, { fill: ACCENT, weight: 600 });
      s2 += txt(bx, 160, "equal patches; the number under each square is the customers in it", 10.5, { opacity: 0.6 });
      s2 += "</svg>"; $("densitySvg").innerHTML = s2;
      var perTxt = fmtNum(per, per < 10 && per !== Math.round(per) ? 1 : 0);
      function costTxt(rt, would) { var pc = Math.round(Math.abs(1 - rt) * 100), v = would ? "would cost" : "costs"; return Math.abs(rt - 1) < 0.005 ? "each of yours " + v + " the same to reach as each of theirs" : rt < 1 ? "each of yours " + v + " " + pc + "% less to reach than each of theirs" : rt < 2 ? "each of yours " + v + " " + pc + "% more to reach than each of theirs" : "each of yours " + v + " " + f1(rt) + " times as much to reach as each of theirs"; }
      var r = (k === 1 ? "All " + fmtNum(S, 0) + " of your customers are in one patch against the rival's " + fmtNum(R, 0) + ", so " : "Across " + plural(k, "patch", "patches") + " you have " + perTxt + " customers in each against the rival's " + fmtNum(R, 0) + " in one, so ") + "<span class=\"n\">" + costTxt(ratio, false) + "</span>.";
      var sub;
      if (k === 1) {
        /* what the slider will show, said in advance: where you draw level, and where ten patches leaves you */
        var kL = S / R, exact = kL >= 2 && kL <= 10 && Math.abs(kL - Math.round(kL)) < 1e-9, r10 = Math.sqrt(R / (S / 10));
        sub = "Spread the same " + fmtNum(S, 0) + " across more patches and each of them costs more to reach: ";
        if (exact && kL === 10) sub += "across ten you would be level with the rival in each.";
        else if (exact) sub += "across " + word(kL) + " you would be level with the rival in each, and across ten " + costTxt(r10, true) + ".";
        else sub += "across ten " + costTxt(r10, true) + ".";
      } else {
        sub = "The cost is set by the " + perTxt + " in each patch, and your total of " + fmtNum(S, 0) + " only sets how thinly that's spread." + (mult > 1 ? " " + cap(f1(mult)) + " times their customers overall changes nothing inside any one patch." : "");
      }
      $("densityRead").innerHTML = r + "<span class=\"sub\">" + sub + "</span>";
    }
    on(["dPatches"], render); render();
  })();

  /* tell the page that embeds this how tall to make the frame */
  (function () {
    var last = 0;
    function report() {
      var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (h && Math.abs(h - last) > 2) { last = h; try { parent.postMessage({ instrument: "road-by-road", height: h }, "*"); } catch (e) {} }
    }
    window.addEventListener("load", report);
    window.addEventListener("resize", report);
    if (window.ResizeObserver) new ResizeObserver(report).observe(document.body);
    setTimeout(report, 120); setTimeout(report, 600);
  })();
})();
</script>
</body>
</html>
