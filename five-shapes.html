* { box-sizing: border-box; }

/* the three layers */
.layer { display: flex; flex-direction: column; gap: 0.6rem; }
.layer-label { margin: 0; font-family: var(--sans); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-mute); }

/* layer one: the pack, quoted rather than endorsed */
.card { position: relative; display: grid; gap: 0.6rem 1rem; padding: 1.5rem 1rem 0.9rem; background: var(--panel); border: 1px dashed var(--rule-firm); border-radius: 6px; font-family: var(--sans); max-width: 430px; }
.card::before { content: "as reported"; position: absolute; top: 0.45rem; left: 1rem; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-mute); }
.card.c2 { grid-template-columns: 1fr 1fr; } .card.c3 { grid-template-columns: 1fr 1fr 1fr; } .card.c4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

.card table th { font-weight: 500; color: var(--ink-mute); padding: 0 0.45rem 0.15rem 0; text-align: right; }
.card table td { padding: 0 0.45rem 0 0; text-align: right; color: var(--ink); }

.case .cf > span:first-child { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-mute); line-height: 1.2; }
.case .in { display: flex; align-items: center; gap: 0.2rem; }
.case .in b { font-weight: 500; color: var(--ink-mute); }
.case input, .stage input { font: inherit; font-family: var(--sans); font-size: 0.9rem; font-weight: 600; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 4px; padding: 0.3rem 0.4rem; width: 5.6em; min-height: 36px; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }

.case .reset:hover { color: var(--accent-text); border-color: var(--accent); }
.case .derived { flex-basis: 100%; font-size: 0.78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.stage input { width: 100%; text-align: center; padding: 0.3rem 0.2rem; }

.controls { display: flex; flex-direction: column; gap: 0.4rem; }

.control label output, .control label b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.control .aside { color: var(--ink-mute); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer; touch-action: pan-y; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: var(--rule); border-radius: 2px; }

input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; margin-top: -11.5px; border-radius: 50%; background: var(--accent); border: 3px solid var(--thumb-ring); box-shadow: 0 0 0 1px var(--accent); }
input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 3px solid var(--thumb-ring); box-shadow: 0 0 0 1px var(--accent); }

.btn { font: inherit; font-family: var(--sans); font-size: 0.85rem; font-weight: 500; color: var(--accent-text); background: none; border: 1px solid var(--accent); border-radius: 4px; padding: 0.55rem 0.8rem; min-height: 44px; cursor: pointer; }
.btn.quiet { color: var(--ink-soft); border-color: var(--rule); }
/* funnel stages */
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.45rem; font-family: var(--sans); font-size: 0.8rem; }
.stage { display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem 0.5rem; align-items: end; min-width: 0; }
.stage .nm { grid-column: 1 / -1; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; color: var(--ink); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage .fld { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
.stage .fld > span { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.02em; line-height: 1.25; color: var(--ink-mute); text-wrap: balance; }
.stage .fld .in { display: flex; align-items: center; gap: 0.2rem; }

.stage-note { margin: 0; font-family: var(--sans); font-size: 0.8rem; line-height: 1.45; color: var(--ink-soft); }
.stage-note b { color: var(--ink); font-weight: 600; }
.stage input { font: inherit; font-family: var(--sans); font-size: 0.9rem; font-weight: 600; color: var(--ink); background: var(--field); border: 1px solid var(--rule); border-radius: 4px; padding: 0.3rem 0.4rem; width: 100%; min-width: 0; min-height: 36px; font-variant-numeric: tabular-nums; text-align: right; -moz-appearance: textfield; }
.stage input::-webkit-inner-spin-button { -webkit-appearance: none; }
.stage input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 480px) { .stages { grid-template-columns: 1fr; gap: 0.7rem; } .stage input { font-size: 16px; } }
.gate-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; font-family: var(--sans); font-size: 0.85rem; color: var(--ink-soft); }

.board { overflow-x: auto; font-family: var(--sans); font-size: 0.8rem; max-width: 430px; }
.board table { border-collapse: collapse; width: 100%; min-width: 330px; font-variant-numeric: tabular-nums; }
.board th, .board td { padding: 0.3rem 0.4rem; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--rule); }
.board th:first-child, .board td:first-child { text-align: left; color: var(--ink-mute); font-weight: 500; padding-left: 0; }

</style>

  function on(ids, fn) { ids.forEach(function (id) { $(id).addEventListener("input", fn); }); }
  function onRadios(name, fn) { document.querySelectorAll('input[name="' + name + '"]').forEach(function (el) { el.addEventListener("change", fn); }); }
  function radio(name) { var el = document.querySelector('input[name="' + name + '"]:checked'); return el ? el.value : ""; }
  function seg(id, name, items, checked) { $(id).innerHTML = items.map(function (it) { return '<label><input type="radio" name="' + name + '" value="' + it[0] + '"' + (String(it[0]) === String(checked) ? " checked" : "") + '><span>' + it[1] + '</span></label>'; }).join(""); }
  function tile(k, v, d, cls) { return '<div><span class="k">' + k + '</span><span class="v">' + v + '</span>' + (d ? '<span class="d ' + (cls || "flat") + '">' + d + '</span>' : '') + '</div>'; }
  function tag(t, cls) { return '<span class="tag ' + cls + '">' + t + '</span>'; }
  function stamp(k, t, cls, note) { return '<div><span class="k">' + k + '</span><span class="v">' + tag(t, cls) + '</span>' + (note ? '<span class="note">' + note + '</span>' : '') + '</div>'; }
  function working(id, lines, essay) { $(id).innerHTML = lines.map(function (l) { return "<p>" + l + "</p>"; }).join("") + (essay ? '<p class="essay">' + esc(essay) + "</p>" : ""); }
  function caseUI(id, defs, onChange) {
    var box = $(id), html = '<span class="case-label">The case</span>';
    defs.forEach(function (d) { html += '<label class="cf"><span>' + d.label + '</span><span class="in">' + (d.prefix ? '<b>' + d.prefix + '</b>' : '') + '<input type="number" inputmode="decimal" data-k="' + d.k + '" value="' + d.v + '" min="' + d.min + '" max="' + d.max + '" step="' + (d.step || "any") + '" aria-label="' + d.label + '">' + (d.suffix ? '<b>' + d.suffix + '</b>' : '') + '</span></label>'; });
    html += '<button type="button" class="reset">Reset</button><span class="derived" hidden></span>';
    box.innerHTML = html;
    var inputs = {}; box.querySelectorAll("input").forEach(function (el) { inputs[el.getAttribute("data-k")] = el; el.addEventListener("input", onChange); el.addEventListener("blur", function () { el.value = get(el.getAttribute("data-k")); onChange(); }); });
    box.querySelector(".reset").addEventListener("click", function () { defs.forEach(function (d) { inputs[d.k].value = d.v; }); onChange(); });
    function get(k) { var el = inputs[k], v = parseFloat(el.value); if (isNaN(v)) v = +el.defaultValue; return Math.min(+el.max, Math.max(+el.min, v)); }
    return { get: get, derived: function (s) { var el = box.querySelector(".derived"); el.hidden = !s; el.textContent = s || ""; } };
  }
  function hatch(id, color) { return '<defs><pattern id="' + id + '" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="' + color + '" stroke-width="1" opacity="0.5"/></pattern></defs>'; }

  /* ================= 4. The band ================= */
  (function () {
    var C = CASE.band, S_ALL = {}; C.series.forEach(function (s) { S_ALL[s.key] = s; });
    seg("bandSeriesSeg", "bseries", C.series.map(function (s) { return [s.key, s.tab]; }), "drift");
    var CU = caseUI("bandCase", [{ k: "base", label: "Baseline months", v: C.baseline, min: 3, max: 12, step: 1 }, { k: "run", label: "Run that counts as a shift", suffix: "months", v: C.run, min: 3, max: 10, step: 1 }], function () { render(); });
    function render() {
      var S = S_ALL[radio("bseries")] || C.series[0], mode = radio("bband"), k = +$("bWig").value / 100, dp = S.dp, n = S.vals.length, last = n - 1, uw = S.unitWord, RUN = CU.get("run");
      working("bandW", ["centre and band are set on the first " + CU.get("base") + " months and tested on the rest", "±1 sd, ±2 sd: standard deviation of those first months", "process limits: centre ± " + C.xmrK + " × mean |month − previous month| <i>(the XmR chart; the " + C.xmrK + " turns an average move into a three-sigma band)</i>", "a shift is reported when the last " + RUN + " months all sit on one side of the centre <i>(the essay's shorthand is three months trending one way)</i>", "each shape is an underlying level or trend plus what is left over; the bounce slider scales only what is left over, so the underlying never moves"], C.essay);
      $("bWigOut").textContent = Math.abs(k - 1) < 1e-9 ? "as it really was" : k === 0 ? "not at all" : "×" + f1(k);
      var und = S.base;
      var pow = Math.pow(10, dp), rnd = function (v) { return Math.round(v * pow) / pow; };
      var nums = S.vals.map(function (v, i) { return rnd(und[i] + k * (v - und[i])); });
      function fmt(v) { return fmtNum(v, dp); }
      function delta(a, b2) { var d = a - b2, abs = S.pts || S.abs, v = abs ? d : d / b2 * 100, u = S.dUnit || (S.pts ? " pts" : "%"); if (S.dUnit === " days" && Math.abs(Math.round(v)) === 1) u = " day"; var plain = fmtNum(Math.abs(v), S.abs && !S.pts ? dp : 1) + u; if (Math.abs(Math.round(v * 10) / 10) < 0.05) return { txt: "level", cls: "flat", plain: "level", up: false, level: true }; /* a cost or a debtor day is good when it falls */ var good = S.down ? v < 0 : v > 0; return { txt: (v > 0 ? "▲ " : "▼ ") + plain, cls: good ? "good" : "bad", plain: plain, up: v > 0, level: false }; }

      var row = '<div class="row"><table><tr>' + S.months.map(function (m) { return "<th>" + m + "</th>"; }).join("") + "</tr><tr>" + nums.map(function (v) { return "<td>" + fmt(v) + "</td>"; }).join("") + "</tr></table></div>";
      $("bandCard").innerHTML = row + tile(S.name + (S.unit ? ", " + S.unit : "") + " · " + S.months[last], fmt(nums[last])) + tile(S.months[last - 1] + " was", fmt(nums[last - 1]), dm.txt, dm.cls) + (dy ? tile(S.months[last - 12] + " was", fmt(nums[last - 12]), dy.txt, dy.cls) : "<div></div>");
      var b = Math.min(n - 2, Math.max(3, CU.get("base"))), base = nums.slice(0, b), mean = base.reduce(function (a, v) { return a + v; }, 0) / b;
      var sd = Math.sqrt(base.reduce(function (a, v) { return a + (v - mean) * (v - mean); }, 0) / (b - 1));
      var mrs = []; for (var i = 1; i < b; i++) mrs.push(Math.abs(base[i] - base[i - 1])); var mmr = mrs.reduce(function (a, v) { return a + v; }, 0) / mrs.length;
      var half = mode === "sd1" ? sd : mode === "sd2" ? 2 * sd : mode === "xmr" ? C.xmrK * mmr : 0;
      var upl = mean + half, lpl = mean - half, centre = rnd(mean);
      var outside = nums.map(function (v, i) { return mode !== "none" && i >= b && (v > upl + 1e-9 || v < lpl - 1e-9); });
      var side = nums.map(function (v) { return v > mean ? 1 : v < mean ? -1 : 0; });
      var trail = 0; for (var t = n - 1; t >= b; t--) { if (side[t] !== 0 && side[t] === side[last]) trail++; else break; }
      var trailOut = 0; for (var t2 = n - 1; t2 >= b; t2--) { if (outside[t2] && side[t2] === side[last]) trailOut++; else break; }
      var nOut = outside.filter(Boolean).length, shift = trail >= RUN;
      /* frame fixed by the series at full bounce, so turning the bounce down visibly calms the line */
      var numsMax = S.vals.map(function (v, i) { return und[i] + 3 * (v - und[i]); }), baseMax = numsMax.slice(0, b), meanMax = baseMax.reduce(function (a, v) { return a + v; }, 0) / b;
      var mrsMax = []; for (var im = 1; im < b; im++) mrsMax.push(Math.abs(baseMax[im] - baseMax[im - 1])); var halfMax = C.xmrK * mrsMax.reduce(function (a, v) { return a + v; }, 0) / mrsMax.length;
      var frame = numsMax.concat([meanMax - halfMax, meanMax + halfMax]), lo = Math.min.apply(null, frame), hi = Math.max.apply(null, frame), pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
      var X0 = 10, X1 = 337, Y0 = 24, Y1 = 122;
      function X(i) { return X0 + (X1 - X0) * i / (n - 1); } function Y(v) { return Y1 - (Y1 - Y0) * (v - lo) / (hi - lo); }
      var s = '<svg viewBox="0 0 345 152" role="img" aria-label="The same months plotted, with the band you have chosen">';
      if (mode !== "none") {
        s += '<rect x="' + X0 + '" y="' + Y(upl).toFixed(1) + '" width="' + (X1 - X0) + '" height="' + (Y(lpl) - Y(upl)).toFixed(1) + '" fill="currentColor" opacity="0.11"/>';
        s += '<line x1="' + X0 + '" y1="' + Y(upl).toFixed(1) + '" x2="' + X1 + '" y2="' + Y(upl).toFixed(1) + '" stroke="currentColor" stroke-width="0.6" opacity="0.5"/><line x1="' + X0 + '" y1="' + Y(lpl).toFixed(1) + '" x2="' + X1 + '" y2="' + Y(lpl).toFixed(1) + '" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>';
        s += '<line x1="' + X0 + '" y1="' + Y(mean).toFixed(1) + '" x2="' + X1 + '" y2="' + Y(mean).toFixed(1) + '" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.45"/>';
        var xb = (X(b - 1) + X(b)) / 2; s += '<line x1="' + xb.toFixed(1) + '" y1="' + Y0 + '" x2="' + xb.toFixed(1) + '" y2="' + Y1 + '" stroke="currentColor" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.35"/>';
        s += txt(X1, Y(upl) - 4 < 30 ? Math.max(Y(upl) + 12, 32) : Y(upl) - 4, "band ±" + fmt(half) + (S.pts ? " pts" : (S.dUnit || "")), 10, { opacity: 0.6, anchor: "end" });
      }
      s += '<polyline points="' + nums.map(function (v, i) { return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" ") + '" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.85"/>';
      for (var j = 0; j < n; j++) {
        if (outside[j]) s += '<circle cx="' + X(j).toFixed(1) + '" cy="' + Y(nums[j]).toFixed(1) + '" r="4" fill="' + ACCENT + '"/>';
        else if (mode !== "none" && shift && j >= n - trail) s += '<circle cx="' + X(j).toFixed(1) + '" cy="' + Y(nums[j]).toFixed(1) + '" r="3.4" fill="none" stroke="' + ACCENT + '" stroke-width="1.4"/>';
        else s += '<circle cx="' + X(j).toFixed(1) + '" cy="' + Y(nums[j]).toFixed(1) + '" r="2.5" fill="currentColor"/>';

      s += txt(X0, 14, mode === "none" ? "the same numbers, plotted on a fixed scale" : "band from the first " + b + " months; filled dots are outside it", 10, { opacity: 0.6 });
      s += txt(X0, 140, S.months[0], 10, { opacity: 0.6 }); s += txt(X1, 140, S.months[last], 10, { opacity: 0.6, anchor: "end" });
      s += "</svg>"; $("bandSvg").innerHTML = s;
      var dir = side[last] > 0 ? "above" : "below", r, sub, d0 = nums[last] - centre;
      var driftTxt = Math.abs(d0) < Math.pow(10, -dp) / 2 ? null : (d0 < 0 ? "down " : "up ") + fmt(Math.abs(d0)) + uw + " on the first " + b + " months' average of " + fmt(centre);
      var dirWord = function (d) { return d.level ? "level" : d.up ? "up" : "down"; };
      if (mode === "none") {
        r = "The pack says " + S.months[last] + " is " + dirWord(dm) + " on " + S.months[last - 1] + (dy ? " and " + dirWord(dy) + " on " + S.months[last - 12] : "") + ". Plotted, the same numbers show " + (trail >= 3 ? "<span class=\"n\">" + trail + " months in a row " + dir + " the level of the first " + b + "</span>" : "<span class=\"n\">a line that wanders</span>") + (driftTxt ? ", " + driftTxt : "") + ".";
        sub = "Add a band to see which months, if any, are worth a question.";
      } else {
        var how = mode === "sd1" ? "one standard deviation" : mode === "sd2" ? "two standard deviations" : C.xmrK + " times the average month-to-month move";
        var verdict;
        if (nOut === 0 && !shift) verdict = "Nothing outside the limits and no run: nothing to investigate.";
        else if (nOut === 0) verdict = cap(plural(trail, "month")) + " in a row " + dir + " the centre.";
        else if (nOut === 1 && !shift) verdict = "One month outside the limits, and nothing since.";
        else if (!shift) verdict = cap(plural(nOut, "month")) + " outside the limits.";
        else verdict = cap(plural(nOut, "month")) + " outside, and " + plural(trail, "month") + " in a row " + dir + " the centre.";
        var flatBase = Math.abs(half) < Math.pow(10, -dp) / 2;
        r = "<span class=\"n\">" + verdict + "</span> " + (flatBase
          ? "Centre " + fmt(centre) + ", and a band that collapses onto the line: with no bounce at all in the first " + b + " months there is nothing for the limits to allow for."
          : "Centre " + fmt(centre) + " and a band of ±" + fmt(half) + uw + ", set by the first " + b + " months: " + how + ", and this series moves about " + fmt(mmr) + uw + " a month.");
        var quiet = trail >= 3 && trailOut === 0;
        sub = S.guide;
        if (Math.abs(k - 1) > 1e-9) sub += k < 0.6 ? " With the bounce turned down, the same underlying shape is unmistakable." : " Turn the bounce up and the noise starts to swallow the shape, without the shape having changed at all.";
        else if (mode === "sd1") sub += " A band this narrow flags about a third of ordinary months for nothing.";
        else if (mode === "sd2") sub += " Nineteen ordinary months in twenty fall inside two standard deviations, so what falls outside has earned a question.";
      }

    }
    onRadios("bseries", render); onRadios("bband", render); $("bWig").addEventListener("input", render); render();
  })();

  /* tell the page that embeds this how tall to make the frame */
  (function () {
    var last = 0;
    function report() {
      var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
      if (h && Math.abs(h - last) > 2) { last = h; try { parent.postMessage({ instrument: "five-shapes", height: h }, "*"); } catch (e) {} }
    }

    window.addEventListener("resize", report);
